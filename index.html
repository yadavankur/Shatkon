<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shatkon</title>
<link rel="icon" href="docs/brand/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#040812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shatkon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* The landing page: three doors (Story, Play, Workshop) and Continue. Each door opens one level down;
   a game starts in play.html with ?mode=... (see the end of ui/play.js main()). */
:root{--bg:#040812;--panel:#0c1830;--panel2:#08111f;--line:#1f3552;--text:#e7ecf6;--muted:#8f9cba;--accent:#7fd8f0;--good:#2fe0b0;--warn:#d9a441;--p1:#ff8bd8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 120%,#0d2140 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:18px}
.brand img{width:30px;height:30px}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(12,24,48,.8);text-decoration:none;font-size:20px;flex:none}
.top h1{margin:0;font-size:18px;font-weight:700}
.sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(12,24,48,.8);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;text-decoration:none;font-size:18px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;width:100%;max-width:980px;margin:0 auto;padding:12px 0}
.continue{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px solid var(--accent);background:rgba(127,216,240,.08);text-decoration:none;min-height:56px}
.continue b{color:var(--accent);font-size:16px}
.continue span{color:var(--muted);font-size:13px}
.continue .go{margin-left:auto;font-size:22px;color:var(--accent)}
.doors{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.door{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;min-height:150px;padding:16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,34,64,.95),rgba(8,17,31,.95));text-decoration:none;position:relative;overflow:hidden}
.door:hover,.door:focus-visible{border-color:var(--accent);outline:none}
.door .ico{color:var(--accent);margin-bottom:auto}
.door b{font-size:20px}
.door span{color:var(--muted);font-size:13px}
.door.story{border-color:#e8c15a66;background:linear-gradient(160deg,#2a2210,#0b1020 70%)}
.door.story .ico{color:#e8c15a}
.door.story b{color:#ffe08a}
.door .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#1a1206;background:#e8c15a;border-radius:999px;padding:2px 9px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(12,24,48,.85);text-decoration:none;cursor:pointer;text-align:left;min-height:64px}
.item:hover,.item:focus-visible{border-color:var(--accent);outline:none}
.item .ico{color:var(--accent);flex:none;margin-top:2px}
.item b{display:block;font-size:15.5px}
.item span{display:block;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item i{display:block;font-style:normal;font-size:12.5px;color:#bfe9d3;margin-top:4px}
.item .num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 13px ui-monospace,monospace;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 16px;min-height:40px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
footer{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
footer a,footer button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(12,24,48,.8);text-decoration:none;cursor:pointer;font-size:14px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,8,18,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.sheet .box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ico{display:block}
/* a phone held sideways: everything fits on one screen */
@media (max-height:540px) and (orientation:landscape){
  main{padding:6px 0;gap:10px}
  .door{min-height:118px;padding:12px 14px}
  .door b{font-size:18px}
  .list{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .item{padding:9px 12px;min-height:54px}
}
@media (max-width:640px) and (orientation:portrait){
  .doors{grid-template-columns:1fr}
  .door{min-height:104px}
}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="main" aria-live="polite"></main>
<footer id="foot"></footer>
<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="sett"></div>
<script>
// ---------- helpers ----------
const $ = (q) => document.querySelector(q);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const PATHS = {
  story: 'M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3zM18 20a2 2 0 0 0 2-2V6M8 8h6M8 12h6',
  play: 'M7 4l13 8-13 8z',
  tools: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z',
  cpu: 'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4',
  phone: 'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2',
  phones: 'M3 5h7a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM14 4h7a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-7M15 9h4M15 12h4',
  lab: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7 15h10',
  test: 'M4 6h16M4 12h10M4 18h7M17 15l2 2 3-4',
  eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  ship: 'M12 2l7 4v6c0 5-3 8-7 10-4-2-7-5-7-10V6z',
  doc: 'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h6',
  gear: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  join: 'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3',
  start: 'M12 5v14M5 12h14',
};
const ico = (n, size = 26) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ico'); s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('fill', n === 'play' ? 'currentColor' : 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); const p = document.createElementNS(s.namespaceURI, 'path'); p.setAttribute('d', PATHS[n]); s.append(p); return s; };
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const game = (params) => 'play.html?' + new URLSearchParams(params);

// ---------- the boards: read from boards.html, the one list of them ----------
let BOARDS = null;
async function boards() {
  if (BOARDS) return BOARDS;
  try {
    const doc = new DOMParser().parseFromString(await (await fetch('boards.html')).text(), 'text/html');
    BOARDS = [...doc.querySelectorAll('a.board')].map((a) => ({
      id: new URL(a.getAttribute('href'), location.href).searchParams.get('board'),
      name: (a.querySelector('b') || {}).textContent || '', about: (a.querySelector('span') || {}).textContent || '', tip: (a.querySelector('i') || {}).textContent || '',
    })).filter((b) => b.id);
  } catch (e) { BOARDS = []; }
  return BOARDS;
}

// ---------- screens ----------
const SCREENS = {
  '': { title: null, draw: home },
  play: { title: 'Play', back: '', draw: playMenu },
  'play/cpu': { title: 'Vs computer', back: 'play', draw: () => boardPicker('cpu') },
  'play/same': { title: 'Same phone', back: 'play', draw: () => boardPicker('pass') },
  'play/two': { title: 'Two phones', back: 'play', draw: twoPhones },
  'play/two/start': { title: 'Start a game for two phones', back: 'play/two', draw: () => boardPicker('p1') },
  workshop: { title: 'Workshop', back: '', draw: workshop },
  'workshop/open': { title: 'Open board', back: 'workshop', draw: () => boardPicker('all') },
};
function route() {
  const key = location.hash.replace(/^#\/?/, ''), sc = SCREENS[key] || SCREENS[''];
  const top = $('#top'), main = $('#main');
  top.textContent = ''; main.textContent = '';
  if (sc.title) top.append(h('a', { class: 'back', href: '#' + sc.back, 'aria-label': 'Back' }, '‹'), h('h1', null, sc.title));
  else top.append(h('div', { class: 'brand' }, h('img', { src: 'docs/brand/favicon.svg', alt: '' }), 'SHATKON'));
  top.append(h('span', { class: 'sp' }));
  sc.draw(main);
  const f = $('#foot'); f.textContent = '';
  if (!sc.title) f.append(h('a', { href: 'docs/' }, ico('doc', 18), 'How to play'), h('button', { onclick: openSettings }, ico('gear', 18), 'Settings'));
}
window.addEventListener('hashchange', route);

function home(main) {
  let last = null;
  try { last = JSON.parse(ls.get('shatkon.last') || 'null'); } catch (e) {}
  if (last && !last.over) {
    const what = last.story ? 'Story' + (last.title ? ': ' + last.title : '') : ({ cpu: 'Vs computer', pass: 'Same phone', all: 'Open board' }[last.seat] || 'Two phones');
    const href = last.board ? game({ board: last.board }) : 'play.html';
    main.append(h('a', { class: 'continue', href }, ico('play', 22), h('div', null, h('b', null, 'Continue'), h('span', null, ' ' + what + (last.round ? ' · round ' + last.round : ''))), h('span', { class: 'go' }, '›')));
  }
  main.append(h('div', { class: 'doors' },
    h('a', { class: 'door story', href: game({ mode: 'story' }) }, ico('story', 30), h('span', { class: 'tag' }, 'START HERE'), h('b', null, 'Story'), h('span', null, 'Learn to play, one chapter at a time.')),
    h('a', { class: 'door', href: '#play' }, ico('play', 28), h('b', null, 'Play'), h('span', null, 'The computer, or a friend on the same phone or two phones.')),
    h('a', { class: 'door', href: '#workshop' }, ico('tools', 28), h('b', null, 'Workshop'), h('span', null, 'Design ships, test chapters, see the whole board.'))));
}
const item = (href, icon, name, about, onclick) => h(href ? 'a' : 'button', { class: 'item', href, onclick }, ico(icon), h('div', null, h('b', null, name), h('span', null, about)));
function playMenu(main) {
  main.append(h('div', { class: 'list' },
    item('#play/cpu', 'cpu', 'Vs computer', 'Pick a board and how hard the computer plays.'),
    item('#play/same', 'phone', 'Same phone', 'Two players take turns on this phone. Each sees only their own fleet.'),
    item('#play/two', 'phones', 'Two phones', 'Play a friend on their own phone by swapping short codes.')));
}
function twoPhones(main) {
  main.append(h('div', { class: 'list' },
    item('#play/two/start', 'start', 'Start a game', 'Pick a board. You get a game code to send your friend.'),
    item(game({ mode: 'join' }), 'join', 'Join a game', 'Paste the game code your friend sent you.')));
  main.append(h('p', { class: 'muted' }, 'After the first code you only swap turn codes: send yours after each turn, paste theirs when it arrives.'));
}
function workshop(main) {
  main.append(h('div', { class: 'list' },
    item('play.html#lab', 'lab', 'Ship Lab', 'Design ships, compare how they see each other, run duels, change rule knobs.'),
    item(game({ mode: 'test' }), 'test', 'Test a chapter', 'Jump into any story chapter and tune it before it starts.'),
    item('#workshop/open', 'eye', 'Open board', 'No fog: one screen, you command both sides. For learning a rule or testing a board.'),
    item('ui/ships-gallery.html', 'ship', 'Ship gallery', 'Every ship drawn in every style.'),
    item('rules.html', 'doc', 'Rule viewer', 'The raw rule files.')));
}
async function boardPicker(mode) {
  const main = $('#main');
  let level = ls.get('shatkon.ai') === 'easy' ? 'easy' : 'normal';
  if (mode === 'cpu') {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'How hard the computer plays' });
    const draw = () => { seg.textContent = ''; for (const [v, t] of [['easy', 'Easy'], ['normal', 'Normal']]) seg.append(h('button', { 'aria-pressed': String(level === v), onclick: () => { level = v; ls.set('shatkon.ai', v); draw(); } }, t)); };
    draw();
    main.append(h('div', { class: 'bar' }, h('span', { class: 'muted' }, 'Computer'), seg));
  }
  const list = h('div', { class: 'list' }, h('span', { class: 'muted' }, 'Loading the boards…'));
  main.append(list);
  const bs = await boards();
  list.textContent = '';
  if (!bs.length) { list.append(h('span', { class: 'muted' }, 'The board list could not be loaded.')); return; }
  for (const b of bs) {
    const m = /^(\d+)\.\s*(.*)$/.exec(b.name) || [null, '', b.name];
    list.append(h('button', { class: 'item', onclick: () => { const p = { board: b.id, mode, new: '1' }; if (mode === 'cpu') p.level = level; location.href = game(p); } },
      h('span', { class: 'num' }, m[1] || '•'), h('div', { title: b.tip || null }, h('b', null, m[2]), h('span', null, b.about))));
  }
}

// ---------- settings: the player's own, shared with the game ----------
function openSettings() {
  const box = $('#settings'), labels = ls.get('shatkon.labels') !== 'off', sound = ls.get('shatkon.sfx') !== '0';
  const toggle = (key, on, onVal, offVal, label) => h('div', { class: 'row' }, h('span', null, label),
    h('div', { class: 'seg', role: 'group', 'aria-label': label },
      h('button', { 'aria-pressed': String(on), onclick: () => { ls.set(key, onVal); openSettings(); } }, 'On'),
      h('button', { 'aria-pressed': String(!on), onclick: () => { ls.set(key, offVal); openSettings(); } }, 'Off')));
  box.textContent = '';
  box.append(h('div', { class: 'box' }, h('h2', { id: 'sett' }, 'Settings'),
    toggle('shatkon.labels', labels, 'on', 'off', 'Labels under icons'),
    toggle('shatkon.sfx', sound, '1', '0', 'Sound'),
    h('p', { class: 'muted' }, 'To play full screen from your home screen: open the browser’s menu and choose “Install app” or “Add to Home Screen”.'),
    h('div', { class: 'row' }, h('span', { class: 'sp' }), h('button', { class: 'iconbtn', style: 'width:auto;padding:0 16px', onclick: () => { box.hidden = true; } }, 'Done'))));
  box.hidden = false;
  box.onclick = (ev) => { if (ev.target === box) box.hidden = true; };
}
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') $('#settings').hidden = true; });

route();
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
</body>
</html>
