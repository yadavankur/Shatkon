<script>
// Launch splash (see lib/splash.js): once per browser session, and not when the address already says where to go.
// A plain dark full-screen box goes up now, before anything is drawn, so the page underneath never flashes.
(function () { try {
  var s = sessionStorage, force = /[?&]splash(=|&|$)/.test(location.search), seen = s.getItem('shatkon.splash');
  if (!force && (seen || location.search || location.hash)) { s.setItem('shatkon.splash', '1'); return; }
  s.setItem('shatkon.splash', '1');
  var d = document, e = d.documentElement, box = d.createElement('div'), js = d.createElement('script');
  box.id = 'splash'; box.setAttribute('aria-hidden', 'true'); box.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:#040812';
  e.appendChild(box);
  js.src = 'lib/splash.js'; js.async = true; js.onerror = function () { box.remove(); };
  d.head.appendChild(js);
  setTimeout(function () { if (!window.ShatkonSplash && box.parentNode) box.remove(); }, 6000);   // never stay stuck if the file cannot load
} catch (x) {} })();
</script>

<style>
/* The landing page: three doors (Story, Play, Workshop) and Continue. Each door opens one level down;
   a game starts in play.html with ?mode=... (see the end of ui/play.js main()). Laid out like a game's
   title screen: logo and a stack of buttons in the middle, round icon buttons along the bottom. */
:root{--bg:#040812;--panel:rgba(10,20,38,.72);--line:rgba(127,216,240,.22);--text:#e7ecf6;--muted:#a7b3cc;--accent:#7fd8f0;--gold:#e8c15a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,rgba(4,8,18,.55) 0%,rgba(4,8,18,.25) 45%,rgba(4,8,18,.8) 100%),url(story/img/stages/vista_quiet_water.webp) center/cover fixed,var(--bg);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
.ico{display:block}
.top{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px}
.top h1{margin:0;font-size:15px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--text)}
.top h1::before,.top h1::after{content:'';display:inline-block;width:22px;height:1px;background:currentColor;opacity:.6;vertical-align:middle;margin:0 10px}
.back{position:absolute;left:0;top:0;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#f2f6fb;color:#071020;text-decoration:none;font-size:26px;line-height:1;padding-bottom:3px}
.sp{display:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;max-width:980px;margin:0 auto;padding:10px 0}
/* home: logo and a stack of buttons */
.logo{width:auto;height:min(24vh,150px);filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.home{display:flex;flex-direction:column;align-items:center;gap:14px}
.stack{display:flex;flex-direction:column;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:220px;min-height:46px;padding:0 26px;border-radius:12px;background:rgba(127,216,240,.88);color:#04101c;text-decoration:none;font-size:19px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pill:hover,.pill:focus-visible{background:#a6e6f7;outline:none}
.pill.story{background:rgba(232,193,90,.92)}
.pill.story:hover,.pill.story:focus-visible{background:#f2d27a}
.pill.ghost{background:rgba(10,20,38,.7);color:var(--text);border:1px solid var(--line)}
.pill small{font-size:12px;letter-spacing:.04em;text-transform:none;opacity:.8}
.continue{flex-direction:column;gap:0;line-height:1.1;padding:6px 26px}
/* sub screens: a few centered cards */
.list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:230px;min-height:150px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-decoration:none;cursor:pointer;text-align:center}
.item:hover,.item:focus-visible{border-color:var(--accent);background:rgba(16,34,60,.85);outline:none}
.item .ico{color:var(--accent)}
.item b{display:block;font-size:17px;font-weight:300;letter-spacing:.14em;text-transform:uppercase}
.item span{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .num{width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font:600 13px ui-monospace,monospace;color:var(--accent)}
/* board picker: a vertical ladder. Dark hex field on this screen only.
   The base .list wraps and centres its cards. Here we must nowrap and
   start at the top, or later boards go into off-screen columns and the
   first boards sit above the scrollport — vertical scroll does nothing useful. */
body.ladder{background:#040812;overflow:hidden;height:100%;max-height:100dvh}
#ladder-hex{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body.ladder .top,body.ladder main,body.ladder footer{position:relative;z-index:1}
main.boards{justify-content:flex-start;flex:1 1 0%;min-height:0;overflow:hidden;align-items:stretch;max-width:860px;display:flex;flex-direction:column;gap:8px}
.boards .bar{flex:0 0 auto;padding:2px 0 6px}
.bar .muted{margin:0;max-width:none}
.boards .list.ladder{display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:0;flex:1 1 0%;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;width:100%;max-width:560px;margin:0 auto;padding:2px 4px 18px 0;align-items:stretch}
.boards .item.board-card{display:flex;flex-direction:row;align-items:stretch;gap:10px;width:100%;flex:0 0 auto;min-height:auto;padding:0 0 8px;border:0;background:transparent;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;text-align:left;cursor:pointer;touch-action:pan-y;animation:ladder-in .42s ease both;animation-delay:calc(var(--i, 0) * 55ms)}
@keyframes ladder-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.boards .item.board-card:hover,.boards .item.board-card:focus-visible{background:transparent;border-color:transparent;outline:none}
.board-card .step{flex:0 0 32px;width:32px;display:flex;flex-direction:column;align-items:center;position:relative}
.board-card .step .n{flex:0 0 32px;width:28px;height:32px;border-radius:0;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font:700 12px/1 ui-monospace,monospace;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));z-index:1;transition:filter .3s ease}
.board-card[data-difficulty="easy"] .n{background:#2f9e62}
.board-card[data-difficulty="medium"] .n{background:#d39a1c}
.board-card[data-difficulty="hard"] .n{background:#e05a32}
.board-card:hover .n,.board-card:focus-visible .n{filter:drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 0 11px rgba(95,247,255,.75))}
.board-card:not(:last-child) .step::after{content:'';flex:1;width:4px;margin-top:-1px;border-radius:2px;min-height:8px}
.board-card[data-difficulty="easy"]:not(:last-child) .step::after{background:linear-gradient(#2f9e62,#7bc47a)}
.board-card[data-difficulty="medium"]:not(:last-child) .step::after{background:linear-gradient(#d39a1c,#e8c15a)}
.board-card[data-difficulty="hard"]:not(:last-child) .step::after{background:linear-gradient(#e05a32,#ff8a5c)}
.board-card .card{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid rgba(21,32,51,.14);background:#fff8ec;box-shadow:0 4px 16px rgba(21,32,51,.12);text-align:left}
.board-card[data-difficulty="easy"] .card{background:linear-gradient(90deg,rgba(70,190,120,.38),#f3fff6 58%);border-color:rgba(47,158,98,.45)}
.board-card[data-difficulty="medium"] .card{background:linear-gradient(90deg,rgba(232,193,90,.46),#fffaf0 58%);border-color:rgba(211,154,28,.5)}
.board-card[data-difficulty="hard"] .card{background:linear-gradient(90deg,rgba(224,90,50,.34),#fff5f0 58%);border-color:rgba(224,90,50,.48)}
.board-card:hover .card,.board-card:focus-visible .card{box-shadow:0 6px 20px rgba(21,32,51,.2);outline:2px solid rgba(21,32,51,.25);outline-offset:1px}
.board-card .preview{flex:0 0 112px;width:112px;height:86px;object-fit:contain;border-radius:8px;background:#1a3a58;border:1px solid rgba(21,32,51,.16)}
.board-card .meta{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.boards .item.board-card b{padding:0;font-size:16px;letter-spacing:.1em;color:#152033}
.boards .item.board-card .about,.boards .item.board-card span.about{padding:0;font-size:13px;line-height:1.4;color:#334155;display:block;-webkit-line-clamp:unset;-webkit-box-orient:unset;overflow:visible}
.stars{display:flex;align-items:center;gap:6px;padding:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.stars i{width:11px;height:11px;flex:0 0 11px;display:inline-block;background:center/contain no-repeat;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='%23556678' stroke-width='1.7' stroke-linejoin='round' d='M12 2.4l2.7 5.7 6.3.8-4.7 4.4 1.3 6.3L12 16.8 6.4 19.6l1.3-6.3L3 8.9l6.3-.8z'/></svg>")}
.stars i.on{opacity:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23d39a1c' d='M12 2.2l2.9 6.1 6.7.8-5 4.7 1.3 6.6L12 17.3 5.1 20.4 6.4 13.8 1.4 9.1l6.7-.8z'/></svg>")}
.stars em{font-style:normal;font-weight:700}
.board-card[data-difficulty="easy"] .stars em{color:#1e7a4a}
.board-card[data-difficulty="medium"] .stars em{color:#9a6e0c}
.board-card[data-difficulty="hard"] .stars em{color:#c2451e}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:0 18px;min-height:40px;cursor:pointer;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04101c;font-weight:700}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.muted{color:var(--muted);font-size:13px;text-align:center;max-width:520px;margin:0}
/* bottom: round icon buttons with a caption */
footer{display:flex;gap:18px;justify-content:center;align-items:flex-start}
footer:empty{display:none}
footer a,footer button{display:inline-flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;text-decoration:none;font-size:11.5px;color:var(--text);text-shadow:0 1px 3px #000}
footer .round{width:50px;height:50px;border-radius:50%;background:#071020;border:2px solid #f2f6fb;display:flex;align-items:center;justify-content:center;color:#f2f6fb}
footer a:hover .round,footer button:hover .round{border-color:var(--accent);color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,8,18,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.sheet .box{width:min(520px,100%);max-height:100%;overflow:auto;background:#0c1830;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:15px;font-weight:300;letter-spacing:.24em;text-transform:uppercase}
.sheet .muted{text-align:left}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ghostbtn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.done{min-height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:#04101c;cursor:pointer;font-weight:700}
/* a phone held sideways: everything fits on one screen */
@media (max-height:540px) and (orientation:landscape){
  main{gap:10px;padding:4px 0}
  .home{flex-direction:row;gap:48px}
  .logo{height:min(52vh,170px)}
  .pill{min-height:40px;font-size:16px;min-width:200px}
  .stack{gap:7px}
  .item{width:200px;min-height:118px;padding:12px}
  footer .round{width:44px;height:44px}
  .top{min-height:36px}
  .top h1{font-size:13px}
  .bar{gap:8px}
  .seg button{padding:0 14px;min-height:32px;font-size:12px}
  main.boards{padding:0;gap:4px;max-width:100%}
  .boards .bar{padding:0 0 4px}
  .boards .list.ladder{padding:0 0 10px}
  .boards .item.board-card{gap:8px;padding-bottom:6px}
  .board-card .step{flex-basis:26px;width:26px}
  .board-card .step .n{flex-basis:26px;width:22px;height:26px;font-size:11px}
  .board-card .card{padding:6px 8px;gap:8px;border-radius:10px}
  .board-card .preview{flex-basis:76px;width:76px;height:58px}
  .boards .item.board-card b{font-size:13px;letter-spacing:.06em}
  .boards .item.board-card .about{font-size:12px;line-height:1.3}
  .stars{gap:3px;font-size:10px}
  .stars i{width:9px;height:9px;flex-basis:9px}
}

@media (prefers-reduced-motion:reduce){
  .boards .item.board-card{animation:none}
  .board-card .n{transition:none}
}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="main" aria-live="polite"></main>
<footer id="foot"></footer>
<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="sett"></div>
<script>
// ---------- helpers ----------
const $ = (q) => document.querySelector(q);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const PATHS = {
  story: 'M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3zM18 20a2 2 0 0 0 2-2V6M8 8h6M8 12h6',
  play: 'M7 4l13 8-13 8z',
  tools: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z',
  cpu: 'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4',
  phone: 'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2',
  phones: 'M3 5h7a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM14 4h7a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-7M15 9h4M15 12h4',
  lab: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7 15h10',
  test: 'M4 6h16M4 12h10M4 18h7M17 15l2 2 3-4',
  eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  ship: 'M12 2l7 4v6c0 5-3 8-7 10-4-2-7-5-7-10V6z',
  doc: 'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h6',
  gear: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  join: 'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3',
  start: 'M12 5v14M5 12h14',
};
const ico = (n, size = 26) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ico'); s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('fill', n === 'play' ? 'currentColor' : 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); const p = document.createElementNS(s.namespaceURI, 'path'); p.setAttribute('d', PATHS[n]); s.append(p); return s; };
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const game = (params) => 'play.html?' + new URLSearchParams(params);

// ---------- the boards: read from boards.html, the one list of them ----------
let BOARDS = null;
async function boards() {
  if (BOARDS) return BOARDS;
  try {
    const doc = new DOMParser().parseFromString(await (await fetch('boards.html')).text(), 'text/html');
    BOARDS = [...doc.querySelectorAll('a.board')].map((a) => ({
      id: new URL(a.getAttribute('href'), location.href).searchParams.get('board'),
      name: (a.querySelector('b') || {}).textContent || '',
      about: (a.querySelector('.about') || a.querySelector('span:not(.stars)') || {}).textContent || '',
      tip: ([...a.querySelectorAll('.meta > i, .about + i')].find((el) => el.textContent) || {}).textContent || '',
      level: (a.getAttribute('data-difficulty') || '').toLowerCase(),
      preview: (a.querySelector('img') && a.querySelector('img').getAttribute('src')) || '',
    })).filter((b) => b.id);
  } catch (e) { BOARDS = []; }
  return BOARDS;
}

// ---------- screens ----------
const SCREENS = {
  '': { title: null, draw: home },
  play: { title: 'Play', back: '', draw: playMenu },
  'play/cpu': { title: 'Vs computer', back: 'play', draw: () => boardPicker('cpu') },
  'play/same': { title: 'Same phone', back: 'play', draw: () => boardPicker('pass') },
  'play/two': { title: 'Two phones', back: 'play', draw: twoPhones },
  'play/two/start': { title: 'Start a game for two phones', back: 'play/two', draw: () => boardPicker('p1') },
  workshop: { title: 'Workshop', back: '', draw: workshop },
  'workshop/open': { title: 'Open board', back: 'workshop', draw: () => boardPicker('all') },
};

// A dark pointy-top hex field behind the board ladder only. A few short
// neon pulses travel along random edges and fade. The grid stays still
// when the player asks for less motion, and the animation pauses if the tab is hidden.
const ladderHex = { on: false, canvas: null, ctx: null, grid: null, pulses: [], raf: 0, last: 0, nextAt: 0, reduce: false };

function stopLadderHex() {
  ladderHex.on = false;
  if (ladderHex.raf) cancelAnimationFrame(ladderHex.raf);
  ladderHex.raf = 0;
  if (ladderHex.onVis) document.removeEventListener('visibilitychange', ladderHex.onVis);
  if (ladderHex.onResize) window.removeEventListener('resize', ladderHex.onResize);
  if (ladderHex.canvas) ladderHex.canvas.remove();
  ladderHex.canvas = ladderHex.ctx = ladderHex.grid = null;
  ladderHex.pulses = [];
}

function startLadderHex() {
  stopLadderHex();
  const c = document.createElement('canvas');
  c.id = 'ladder-hex';
  c.setAttribute('aria-hidden', 'true');
  document.body.prepend(c);
  ladderHex.canvas = c;
  ladderHex.ctx = c.getContext('2d');
  ladderHex.on = true;
  ladderHex.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  ladderHex.onResize = () => paintLadderHex(true);
  ladderHex.onVis = () => {
    if (document.hidden) { if (ladderHex.raf) cancelAnimationFrame(ladderHex.raf); ladderHex.raf = 0; }
    else if (ladderHex.on && !ladderHex.reduce) { ladderHex.last = performance.now(); tickLadderHex(); }
  };
  window.addEventListener('resize', ladderHex.onResize);
  document.addEventListener('visibilitychange', ladderHex.onVis);
  paintLadderHex(true);
  if (!ladderHex.reduce) { ladderHex.last = performance.now(); ladderHex.nextAt = ladderHex.last + 280; tickLadderHex(); }
}

function buildHexGrid(w, h) {
  const S = 28, W = Math.sqrt(3) * S, rowH = 1.5 * S;
  const cols = Math.ceil(w / W) + 2, rows = Math.ceil(h / rowH) + 2;
  const edges = [], byV = new Map(), seen = new Set();
  const vk = (x, y) => Math.round(x) + ',' + Math.round(y);
  const add = (x1, y1, x2, y2) => {
    const a = vk(x1, y1), b = vk(x2, y2);
    const k = a < b ? a + '|' + b : b + '|' + a;
    if (seen.has(k)) return;
    seen.add(k);
    edges.push({ x1, y1, x2, y2, a, b });
    if (!byV.has(a)) byV.set(a, []);
    if (!byV.has(b)) byV.set(b, []);
    byV.get(a).push({ x: x2, y: y2, key: b });
    byV.get(b).push({ x: x1, y: y1, key: a });
  };
  for (let r = -1; r <= rows; r++) {
    for (let c = -1; c <= cols; c++) {
      const cx = W * (c + (r & 1) * 0.5), cy = rowH * r, pts = [];
      for (let i = 0; i < 6; i++) {
        const ang = -Math.PI / 2 + i * Math.PI / 3;
        pts.push([cx + S * Math.cos(ang), cy + S * Math.sin(ang)]);
      }
      for (let i = 0; i < 6; i++) add(pts[i][0], pts[i][1], pts[(i + 1) % 6][0], pts[(i + 1) % 6][1]);
    }
  }
  return { edges, byV };
}

function paintLadderHex(rebuild) {
  const c = ladderHex.canvas, ctx = ladderHex.ctx;
  if (!c || !ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  if (rebuild || c.width !== Math.floor(w * dpr) || c.height !== Math.floor(h * dpr)) {
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    ladderHex.grid = buildHexGrid(w, h);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#040812';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(127,216,240,0.18)';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const e of ladderHex.grid.edges) { ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); }
  ctx.stroke();
  for (const p of ladderHex.pulses) drawLadderPulse(ctx, p);
}

function spawnLadderPulse() {
  const g = ladderHex.grid;
  if (!g || !g.edges.length) return;
  const start = g.edges[(Math.random() * g.edges.length) | 0];
  const path = [{ x: start.x1, y: start.y1, key: start.a }, { x: start.x2, y: start.y2, key: start.b }];
  let cur = start.b, prev = start.a;
  const extra = 1 + ((Math.random() * 3) | 0);
  for (let i = 0; i < extra; i++) {
    const nbrs = (g.byV.get(cur) || []).filter((n) => n.key !== prev);
    if (!nbrs.length) break;
    const n = nbrs[(Math.random() * nbrs.length) | 0];
    path.push({ x: n.x, y: n.y, key: n.key });
    prev = cur; cur = n.key;
  }
  let total = 0;
  const seg = [];
  for (let i = 0; i < path.length - 1; i++) {
    const dx = path[i + 1].x - path[i].x, dy = path[i + 1].y - path[i].y;
    const len = Math.hypot(dx, dy);
    seg.push({ x1: path[i].x, y1: path[i].y, x2: path[i + 1].x, y2: path[i + 1].y, len, start: total });
    total += len;
  }
  if (total < 1) return;
  ladderHex.pulses.push({ seg, total, t: 0, alpha: 0 });
}

function drawLadderPulse(ctx, p) {
  if (p.alpha <= 0) return;
  const trail = Math.min(p.total * 0.45, 40), head = Math.min(p.t, p.total), tail = Math.max(0, head - trail);
  ctx.save();
  ctx.strokeStyle = 'rgba(95,247,255,' + (0.9 * p.alpha) + ')';
  ctx.shadowColor = 'rgba(95,247,255,' + (0.85 * p.alpha) + ')';
  ctx.shadowBlur = 10;
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  let started = false;
  for (const s of p.seg) {
    const a = s.start, b = s.start + s.len;
    const u0 = Math.max(tail, a), u1 = Math.min(head, b);
    if (u1 <= u0) continue;
    const t0 = (u0 - a) / s.len, t1 = (u1 - a) / s.len;
    const x0 = s.x1 + (s.x2 - s.x1) * t0, y0 = s.y1 + (s.y2 - s.y1) * t0;
    const x1 = s.x1 + (s.x2 - s.x1) * t1, y1 = s.y1 + (s.y2 - s.y1) * t1;
    if (!started) { ctx.moveTo(x0, y0); started = true; } else ctx.lineTo(x0, y0);
    ctx.lineTo(x1, y1);
  }
  if (started) ctx.stroke();
  ctx.restore();
}

function tickLadderHex(now) {
  if (!ladderHex.on || ladderHex.reduce || document.hidden) { ladderHex.raf = 0; return; }
  now = now || performance.now();
  const dt = Math.min(0.05, (now - ladderHex.last) / 1000);
  ladderHex.last = now;
  if (ladderHex.pulses.length < 3 && now >= ladderHex.nextAt) {
    spawnLadderPulse();
    ladderHex.nextAt = now + 800 + Math.random() * 1800;
  }
  const speed = 86;
  for (const p of ladderHex.pulses) {
    p.t += speed * dt;
    if (p.t < 16) p.alpha = Math.min(1, p.t / 16);
    else if (p.t >= p.total) p.alpha = Math.max(0, 1 - (p.t - p.total) / 0.5);
    else p.alpha = 1;
  }
  ladderHex.pulses = ladderHex.pulses.filter((p) => p.alpha > 0.02);
  paintLadderHex(false);
  ladderHex.raf = requestAnimationFrame(tickLadderHex);
}

function route() {
  const key = location.hash.replace(/^#\/?/, ''), sc = SCREENS[key] || SCREENS[''];
  const top = $('#top'), main = $('#main');
  stopLadderHex();
  top.textContent = ''; main.textContent = ''; main.className = ''; document.body.classList.remove('ladder');
  if (sc.title) top.append(h('a', { class: 'back', href: '#' + sc.back, 'aria-label': 'Back' }, '‹'), h('h1', null, sc.title));

  sc.draw(main);
  const f = $('#foot'); f.textContent = '';
  if (!sc.title) f.append(h('button', { onclick: openSettings }, h('span', { class: 'round' }, ico('gear', 22)), 'Settings'), h('a', { href: 'docs/' }, h('span', { class: 'round' }, ico('doc', 22)), 'How to play'));
  // the build number (ui/version.js), so a playtest can be matched to its code
  if (!sc.title) import('./ui/version.js').then((v) => { if (!f.querySelector('.build')) f.append(h('span', { class: 'build', style: 'opacity:.55;font-size:12px;align-self:center' }, v.buildLabel())); }).catch(() => {});
}
window.addEventListener('hashchange', route);

function home(main) {
  let last = null;
  try { last = JSON.parse(ls.get('shatkon.last') || 'null'); } catch (e) {}
  const stack = h('div', { class: 'stack' });
  if (last && !last.over) {
    const what = last.story ? 'Story' + (last.title ? ': ' + last.title : '') : ({ cpu: 'Vs computer', pass: 'Same phone', all: 'Open board' }[last.seat] || 'Two phones');
    stack.append(h('a', { class: 'pill continue', href: last.board ? game({ board: last.board }) : 'play.html?continue=1' }, 'Continue', h('small', null, what + (last.round ? ' \u00b7 round ' + last.round : ''))));
  }
  stack.append(h('a', { class: 'pill story', href: game({ mode: 'story' }) }, 'Story'),
    h('a', { class: 'pill', href: '#play' }, 'Play'),
    h('a', { class: 'pill ghost', href: '#workshop' }, 'Workshop'));
  main.append(h('div', { class: 'home' }, h('img', { class: 'logo', src: 'docs/brand/lockup.svg', alt: 'Shatkon' }), stack));
}
const item = (href, icon, name, about, onclick) => h(href ? 'a' : 'button', { class: 'item', href, onclick }, ico(icon, 30), h('b', null, name), h('span', null, about));
function playMenu(main) {
  main.append(h('div', { class: 'list' },
    item('#play/cpu', 'cpu', 'Vs computer', 'Pick a board and how hard the computer plays.'),
    item('#play/same', 'phone', 'Same phone', 'Two players take turns on this phone. Each sees only their own fleet.'),
    item('#play/two', 'phones', 'Two phones', 'Play a friend on their own phone by swapping short codes.'),
    // rapid mode, Grok build (rapid-grok.html, rules/rapid-grok/): one action each, 15 s to act, 5 s to watch.
    item('rapid-grok.html', 'start', 'Rapid Grok', 'Vs computer. One action each: 15 seconds to act, 5 to watch the reply.'),
    // rapid mode (experimental, rules/rapid/): one action a tick, both sides at once, against the clock.
    // "Opus" is this build (Claude Opus); a Grok-built version may sit beside it for comparison.
    item(null, 'start', 'Rapid Opus', 'Vs computer. One action a tick, both sides at once, against the clock.',
      () => battleSheet('Rapid Opus', game({ board: 'rapid_opus', mode: 'cpu', new: '1', level: ls.get('shatkon.ai') === 'easy' ? 'easy' : 'normal' }), true)),
    // economy mode (experimental, third rapid version): Rapid Opus plus salvage earned by flying through the board.
    item(null, 'start', 'Frontier', 'Rapid Opus with an economy: earn salvage in the enemy\u2019s half. Experimental.',
      () => battleSheet('Frontier', game({ board: 'rapid_frontier', mode: 'cpu', new: '1', level: ls.get('shatkon.ai') === 'easy' ? 'easy' : 'normal' }), 'econ'))));
}
function twoPhones(main) {
  main.append(h('div', { class: 'list' },
    item('#play/two/start', 'start', 'Start a game', 'Pick a board. You get a game code to send your friend.'),
    item(game({ mode: 'join' }), 'join', 'Join a game', 'Paste the game code your friend sent you.')));
  main.append(h('p', { class: 'muted' }, 'After the first code you only swap turn codes: send yours after each turn, paste theirs when it arrives.'));
}
function workshop(main) {
  main.append(h('div', { class: 'list' },
    item('play.html#lab', 'lab', 'Ship Lab', 'Design ships, compare how they see each other, run duels, change rule knobs.'),
    item(game({ mode: 'test' }), 'test', 'Test a chapter', 'Jump into any story chapter and tune it before it starts.'),
    item('#workshop/open', 'eye', 'Open board', 'No fog: one screen, you command both sides. For learning a rule or testing a board.'),
    item('ui/ships-gallery.html', 'ship', 'Ship gallery', 'Every ship drawn in every style.'),
    item('rules.html', 'doc', 'Rule viewer', 'The raw rule files.')));
}
async function boardPicker(mode) {
  const main = $('#main');
  main.classList.add('boards');
  document.body.classList.add('ladder');
  startLadderHex();
  let level = ls.get('shatkon.ai') === 'easy' ? 'easy' : 'normal';
  if (mode === 'cpu') {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'How hard the computer plays' });
    const draw = () => { seg.textContent = ''; for (const [v, t] of [['easy', 'Easy'], ['normal', 'Normal']]) seg.append(h('button', { 'aria-pressed': String(level === v), onclick: () => { level = v; ls.set('shatkon.ai', v); draw(); } }, t)); };
    draw();
    main.append(h('div', { class: 'bar' }, h('span', { class: 'muted' }, 'Computer'), seg));
  }
  const list = h('div', { class: 'list ladder' }, h('span', { class: 'muted' }, 'Loading the boards…'));
  main.append(list);
  const bs = await boards();
  list.textContent = '';
  if (!bs.length) { list.append(h('span', { class: 'muted' }, 'The board list could not be loaded.')); return; }
  const fillOf = { easy: 2, medium: 4, hard: 6 };
  const wordOf = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const starRow = (lvl) => {
    const n = fillOf[lvl] || 0, word = wordOf[lvl] || (lvl ? lvl : '');
    const row = h('span', { class: 'stars', 'aria-label': word ? (word + ', ' + n + ' of 6') : 'Difficulty not set' });
    for (let i = 0; i < 6; i++) row.append(h('i', { class: i < n ? 'on' : false }));
    if (word) row.append(h('em', null, word));
    return row;
  };
  bs.forEach((b, i) => {
    const m = /^(\d+)\.\s*(.*)$/.exec(b.name) || [null, '', b.name];
    const title = m[2] || b.name;
    const step = i + 1;
    const meta = [h('b', { title: b.tip || null }, title)];
    if (b.level) meta.push(starRow(b.level));
    meta.push(h('span', { class: 'about' }, b.about));
    const cardKids = [];
    if (b.preview) cardKids.push(h('img', { class: 'preview', src: b.preview, alt: '', 'aria-hidden': 'true' }));
    cardKids.push(h('span', { class: 'meta' }, ...meta));
    list.append(h('button', { class: 'item board-card', 'data-difficulty': b.level || false, 'data-step': String(step), style: '--i:' + i, onclick: () => { const p = { board: b.id, mode, new: '1' }; if (mode === 'cpu') p.level = level; battleSheet(b.name, game(p)); } },
      h('span', { class: 'step', 'aria-hidden': 'true' }, h('span', { class: 'n' }, String(step))),
      h('span', { class: 'card' }, ...cardKids)));
  });
}

// ---------- settings: the player's own, shared with the game ----------
// Battle settings, asked before every skirmish (the form lives in ui/settings.js; the play page uses it too)
async function battleSheet(title, href, rapid = false) {
  const box = $('#settings');
  let S;
  try { S = await import('./ui/settings.js'); } catch (e) { location.href = href; return; }
  S.injectSettingsCss();
  box.textContent = '';
  box.append(h('div', { class: 'box' }, h('h2', { id: 'sett' }, String(title || 'Battle').replace(/^\d+\.\s*/, '')), h('p', { class: 'muted' }, rapid ? 'Rapid mode settings' : 'Battle settings'), S.settingsForm(null, rapid),
    h('div', { class: 'row' }, h('button', { class: 'ghostbtn', onclick: () => { box.hidden = true; } }, 'Back'), h('button', { class: 'done', onclick: () => { location.href = href; } }, 'Start battle'))));
  box.hidden = false;
  box.onclick = (ev) => { if (ev.target === box) box.hidden = true; };
}
function openSettings() {
  const box = $('#settings'), labels = ls.get('shatkon.labels') !== 'off', sound = ls.get('shatkon.sfx') !== '0';
  const toggle = (key, on, onVal, offVal, label) => h('div', { class: 'row' }, h('span', null, label),
    h('div', { class: 'seg', role: 'group', 'aria-label': label },
      h('button', { 'aria-pressed': String(on), onclick: () => { ls.set(key, onVal); openSettings(); } }, 'On'),
      h('button', { 'aria-pressed': String(!on), onclick: () => { ls.set(key, offVal); openSettings(); } }, 'Off')));
  box.textContent = '';
  box.append(h('div', { class: 'box' }, h('h2', { id: 'sett' }, 'Settings'),
    toggle('shatkon.labels', labels, 'on', 'off', 'Labels under icons'),
    toggle('shatkon.sfx', sound, '1', '0', 'Sound'),
    h('p', { class: 'muted' }, 'To play full screen from your home screen: open the browser’s menu and choose “Install app” or “Add to Home Screen”.'),
    h('div', { class: 'row' }, h('span'), h('button', { class: 'done', onclick: () => { box.hidden = true; } }, 'Done'))));
  box.hidden = false;
  box.onclick = (ev) => { if (ev.target === box) box.hidden = true; };
}
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') $('#settings').hidden = true; });

route();
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
