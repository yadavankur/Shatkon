# ============================================================
#  CAMPAIGN MAP  -  "Ashfall Outpost"   (Shatkon: The Weave, chapter 4A)
#  Open space; the wrecked outpost (asteroid tiles) sits in the middle.
#  Zone outpost is every open hex touching the wreck's core [0,0]: the dock where the Graft rig lies.
#  The Weave home zone is deep (rows -8 to -3) so the husks can start near the wreck.
#  Generated by campaign/tools/gen_maps.mjs - edit the shapes there and re-run.
#  Coordinates are [q, r] hex coordinates; [0, 0] is the centre; r grows to the south.
#  Zones given as lists of [q, r] are campaign zones (script triggers, spawns, AI paths);
#  the engine ignores them outside the campaign.
# ============================================================

map:
  name: "Ashfall Outpost"
  world: world_v0.4.yaml

  board:
    shape: hexagon
    radius: 8

  zones:
    player_1_home:  { edge: south, depth: 3 }
    player_2_home:  { edge: north, depth: 6 }
    no_mans_land:   { everything_else: true }
    outpost: [[-1, 0], [-1, 1], [0, -1], [0, 1], [1, -1], [1, 0]]

  setup:
    secret: true
    ships: own_home_zone
    drones: own_home_zone
    mines: { own_home_zone: true, rows_into_no_mans_land: 0 }

  terrain:
    - { type: asteroid, at: [-1, -1], size: 1 }
    - { type: asteroid, at: [-1, 3], size: 1 }
    - { type: asteroid, at: [-2, 1], size: 1 }
    - { type: asteroid, at: [-2, 2], size: 1 }
    - { type: asteroid, at: [0, -2], size: 1 }
    - { type: asteroid, at: [0, 0], size: 1 }
    - { type: asteroid, at: [1, 1], size: 1 }
    - { type: asteroid, at: [2, -1], size: 1 }
    - { type: asteroid, at: [2, -2], size: 1 }
    - { type: asteroid, at: [3, -3], size: 1 }
    - { type: nebula, at: [-5, -1], size: 1 }
    - { type: nebula, at: [-5, -2], size: 1 }
    - { type: nebula, at: [-6, -1], size: 1 }
    - { type: nebula, at: [4, -6], size: 1 }
    - { type: nebula, at: [5, -6], size: 1 }
