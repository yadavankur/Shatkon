# ============================================================
#  CAMPAIGN MAP  -  "Meridian Approach"   (Shatkon: The Weave, chapter 3)
#  A thick asteroid cluster directly north of the human start: cover and a laser shadow.
#  Zone li_arrival is the north-east edge, behind the Twin's start, where li_wing spawns.
#  Generated by campaign/tools/gen_maps.mjs - edit the shapes there and re-run.
#  Coordinates are [q, r] hex coordinates; [0, 0] is the centre; r grows to the south.
#  Zones given as lists of [q, r] are campaign zones (script triggers, spawns, AI paths);
#  the engine ignores them outside the campaign.
# ============================================================

map:
  name: "Meridian Approach"
  world: world_v0.4.yaml

  board:
    shape: hexagon
    radius: 9

  zones:
    player_1_home:  { edge: south, depth: 3 }
    player_2_home:  { edge: north, depth: 4 }
    no_mans_land:   { everything_else: true }
    li_arrival: [[6, -9], [6, -8], [7, -9], [7, -8], [8, -9], [8, -8], [9, -9], [9, -8]]
    cover: [[-5, 6], [-5, 7], [-4, 5], [-4, 7], [-3, 7], [-2, 7], [-1, 6], [0, 5]]

  setup:
    secret: true
    ships: own_home_zone
    drones: own_home_zone
    mines: { own_home_zone: true, rows_into_no_mans_land: 0 }

  terrain:
    - { type: asteroid, at: [-2, 4], radius: 1 }
    - { type: asteroid, at: [-3, 6], size: 3 }
    - { type: asteroid, at: [-1, 2], size: 1 }
    - { type: asteroid, at: [-1, 5], size: 1 }
    - { type: asteroid, at: [-3, -3], size: 1 }
    - { type: asteroid, at: [-5, 1], size: 1 }
    - { type: asteroid, at: [-6, -1], size: 1 }
    - { type: asteroid, at: [-6, 2], size: 1 }
    - { type: asteroid, at: [-7, 5], size: 1 }
    - { type: asteroid, at: [0, -2], size: 1 }
    - { type: asteroid, at: [0, 2], size: 1 }
    - { type: asteroid, at: [0, 3], size: 1 }
    - { type: asteroid, at: [0, 4], size: 1 }
    - { type: asteroid, at: [1, -5], size: 1 }
    - { type: asteroid, at: [2, 0], size: 1 }
    - { type: asteroid, at: [3, 3], size: 1 }
    - { type: asteroid, at: [4, -2], size: 1 }
    - { type: asteroid, at: [5, -3], size: 1 }
    - { type: asteroid, at: [6, -6], size: 1 }
