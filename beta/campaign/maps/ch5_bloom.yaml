    - { type: asteroid, at: [8, -6], size: 1 }
    - { type: nebula, at: [-1, -6], radius: 1 }
    - { type: nebula, at: [2, -6], radius: 1 }
    - { type: nebula, at: [5, -6], radius: 1 }
    - { type: nebula, at: [8, -7], size: 3 }
