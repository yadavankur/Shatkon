# ============================================================
#  CAMPAIGN MAP  -  "Quiet Water"   (Shatkon: The Weave, chapter 2)
#  An asteroid mass across the middle (rows -3 to 1): the only ways south are the west and east lanes.
#  Each lane is mined right across at its south end, row 1 (zones belt_w, belt_e): 3 charges per lane, 6 in all.
#  Lasers do not cross the mass: the Seeds must come down a lane to fight.
#  Generated by campaign/tools/gen_maps.mjs - edit the shapes there and re-run.
#  Coordinates are [q, r] hex coordinates; [0, 0] is the centre; r grows to the south.
#  Zones given as lists of [q, r] are campaign zones (script triggers, spawns, AI paths);
#  the engine ignores them outside the campaign.
# ============================================================

map:
  name: "Quiet Water"
  world: world_v0.4.yaml

  board:
    shape: hexagon
    radius: 8

  zones:
    player_1_home:  { edge: south, depth: 6 }
    player_2_home:  { edge: north, depth: 6 }
    no_mans_land:   { everything_else: true }
    belt_w: [[-8, 1], [-7, 1], [-6, 1]]
    belt_e: [[5, 1], [6, 1], [7, 1]]
    lane_w: [[-8, 0], [-8, 1], [-7, -1], [-7, 0], [-7, 1], [-6, -2], [-6, -1], [-6, 0], [-6, 1], [-5, -3], [-5, -2], [-5, -1], [-5, 0], [-4, -3], [-4, -2]]
    lane_e: [[5, 0], [5, 1], [6, -2], [6, -1], [6, 0], [6, 1], [7, -3], [7, -2], [7, -1], [7, 0], [7, 1], [8, -3], [8, -2], [8, -1], [8, 0]]

  setup:
    secret: true
    ships: own_home_zone
    drones: own_home_zone
    mines: { own_home_zone: true, rows_into_no_mans_land: 8 }

  terrain:
    - { type: asteroid, at: [-2, -1], radius: 2 }
    - { type: asteroid, at: [3, -1], radius: 2 }
    - { type: asteroid, at: [-1, 1], size: 3 }
    - { type: asteroid, at: [1, -3], size: 3 }
    - { type: asteroid, at: [-2, 4], size: 1 }
    - { type: asteroid, at: [-3, -3], size: 1 }
    - { type: asteroid, at: [-5, 1], size: 1 }
    - { type: asteroid, at: [-7, 6], size: 1 }
    - { type: asteroid, at: [0, -6], size: 1 }
    - { type: asteroid, at: [0, 0], size: 1 }
    - { type: asteroid, at: [1, -2], size: 1 }
    - { type: asteroid, at: [3, 3], size: 1 }
    - { type: asteroid, at: [4, 1], size: 1 }
    - { type: asteroid, at: [5, -6], size: 1 }
    - { type: asteroid, at: [6, -3], size: 1 }
    - { type: nebula, at: [-5, 3], radius: 1 }
    - { type: nebula, at: [2, 3], size: 1 }
    - { type: nebula, at: [2, 4], size: 1 }
    - { type: nebula, at: [3, 2], size: 1 }
    - { type: nebula, at: [3, 4], size: 1 }
    - { type: nebula, at: [4, 2], size: 1 }
    - { type: nebula, at: [4, 3], size: 1 }
