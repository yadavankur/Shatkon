# ============================================================
#  CAMPAIGN MAP  -  "Quiet Water"   (Shatkon: The Weave, chapter 2)
#  An asteroid wall across rows 0-1 with one gap in the middle: the only way south for a 2-hex ship.
#  A nebula bank (-2 signature, -3 sensor) covers the gap's north mouth. Mines go in zone minefield.
#  The west-edge slot ([-8,0], [-8,1]) is 1 hex wide: Sparrow can use it, nothing bigger.
#  Generated by campaign/tools/gen_maps.mjs - edit the shapes there and re-run.
#  Coordinates are [q, r] hex coordinates; [0, 0] is the centre; r grows to the south.
#  Zones given as lists of [q, r] are campaign zones (script triggers, spawns, AI paths);
#  the engine ignores them outside the campaign.
# ============================================================

map:
  name: "Quiet Water"
  world: world_v0.4.yaml

  board:
    shape: hexagon
    radius: 8

  zones:
    player_1_home:  { edge: south, depth: 4 }
    player_2_home:  { edge: north, depth: 3 }
    no_mans_land:   { everything_else: true }
    choke: [[-1, -2], [-1, -1], [0, -3], [0, -2], [0, -1], [1, -3], [1, -2], [2, -3], [-1, -3], [-1, 0], [0, 0], [1, 0], [-1, 1], [0, 1], [-1, 2], [0, 2], [1, 2]]
    minefield: [[0, -1], [-1, 0], [1, 0], [0, 1]]
    west_slot: [[-8, 0], [-8, 1]]

  setup:
    secret: true
    ships: own_home_zone
    drones: own_home_zone
    mines: { own_home_zone: true, rows_into_no_mans_land: 6 }

  terrain:
    - { type: asteroid, at: [-6, 0], size: 3 }
    - { type: asteroid, at: [-6, 1], size: 3 }
    - { type: asteroid, at: [-3, 0], size: 3 }
    - { type: asteroid, at: [-3, 1], size: 3 }
    - { type: asteroid, at: [2, 1], size: 3 }
    - { type: asteroid, at: [3, 0], size: 3 }
    - { type: asteroid, at: [5, 1], size: 3 }
    - { type: asteroid, at: [6, 0], size: 3 }
    - { type: asteroid, at: [-2, 7], size: 1 }
    - { type: asteroid, at: [-4, 4], size: 1 }
    - { type: asteroid, at: [-5, -2], size: 1 }
    - { type: asteroid, at: [3, -4], size: 1 }
    - { type: asteroid, at: [4, 3], size: 1 }
    - { type: asteroid, at: [6, -5], size: 1 }
    - { type: asteroid, at: [7, 1], size: 1 }
    - { type: asteroid, at: [8, 0], size: 1 }
    - { type: nebula, at: [0, -2], radius: 1 }
    - { type: nebula, at: [-1, -3], size: 1 }
    - { type: nebula, at: [2, -3], size: 1 }
    - { type: nebula, at: [2, -4], size: 1 }
