# ============================================================
#  CHAPTER 1  -  FIRST CONTACT        map: ch1_corridor (radius 7)
#  Kestrel leads three escorts up a narrow asteroid corridor. A lone Weave Seed kills Finch
#  with a missile, shoots the lasers off Wren and Kite, and turns on Kestrel. Wren and Kite,
#  with nothing left to fight with, throw themselves at the two ends of the Seed. The crippled
#  Seed is Kestrel's to finish. The player commands Kestrel only.
#
#  Combat v2 (campaign-engine 1afc785): Finch, Wren and Kite are `helm: script` (the engine
#  locks them for the whole battle and the fleet strip says "flying itself"); the script flies
#  them with `orders` (hold / move_toward / fire_at / ram), which spend their own budget, not the
#  player's command points or thrust. The hurl is the engine's `ram`, with a forced-ram fallback.
#
#  Key numbers (Combat v2 world: lasers 3 hits to 4 hexes / 2 to 8, +1 after moving; see CHECKS.md):
#   - Start: escorts on row 3, Finch scouting ahead; contact (sees) or round 2.
#   - Finch: unarmed scout, 4-5 hits: the Seed launches (launch_at, 3 hits) once Finch is inside
#     7 hexes and again a round later; each missile lands in that round's flight phase. Doom
#     fallback round 6.
#   - Wren's laser is alone on its front cell, Kite's behind one plate: one Seed shot each.
#     Fallback round 9 switches off any laser still working.
#   - The hurl: `orders: ram` closes in and hurls once the Seed is within this turn's move + 2.
#     Ram hits: 4 x the rammer's living segments (Wren 8, Kite 4), piercing shields, from the
#     Seed segment nearest the rammer. The Seed is protected until both have rammed, so the rams
#     leave a hulk (never a kill). Fallback 3 rounds after the hurl: `ram: { force: true }`.
#   - Rounds: contact 1, Finch 2, disarmed 2-3, the escorts fall back on Kestrel for 2 rounds,
#     hurl (orders: ram closes in), kill +0-1: 8-10.
# ============================================================

chapter:
  id: ch1
  title: "First Contact"
  world: world_v0.4.yaml
  world_overrides:
    "turns.turn_limit": 20
  map: maps/ch1_corridor.yaml

  player:                           # seat 0, south
    ships:
      - kestrel                          # hull kestrel@ch1 (flagship); the only ship the player commands
      - { id: finch, helm: script }      # flies itself: the script's orders, never the player
      - { id: wren,  helm: script }
      - { id: kite,  helm: script }
    deployment:
      - { ship: kestrel, at: [-3, 6] }   # cells [-4,6] [-3,6] [-2,6]
      - { ship: finch,   at: [-2, 3] }   # line abreast across row 3 (4 hexes wide here)
      - { ship: kite,    at: [-3, 3] }
      - { ship: wren,    at: [-1, 3] }   # cells [-1,3] [0,3]
  # The escorts fly line abreast on row 3, 3 rows ahead of Kestrel (the corridor is 3-4 hexes
  # wide; Kestrel is 3); Finch scouts ahead up the corridor from the start.
  # Fleet thrust 4 + 1 + 1 + 3 = 9 for 7 segments: a ship moves up to 2 hexes a turn.

  enemy:                            # seat 1, north
    ships: [seed]                        # hull seed@ch1 (flagship)
    deployment:
      - { ship: seed, at: [2, -6] }      # cells [2,-6] [3,-6]
    ai: { default: hunter }

  ai_profiles:
    # Competent throughout: the gun goes for the escorts' guns (Wren, then Kite) and keeps out of
    # the cutter's 3-hit range (its 3 lasers are the real threat); the unarmed scout gets the
    # missile (the script's launch_at). Missiles: launch_at only (the spare is never spent on locks).
    hunter:    { level: normal, stance: hunt, target: [wren, kite], only_targets: [wren, kite, kestrel], stand_off: { from: kestrel, hexes: 5 }, launch_range: 0 }
    # After Finch: the escorts that can still shoot, Kite first (the smaller), then Wren.
    disarm:    { level: normal, stance: hunt, target: [kite, wren], stand_off: { from: kestrel, hexes: 5 }, launch_range: 5 }
    disarm_w:  { level: normal, stance: hunt, target: [wren], stand_off: { from: kestrel, hexes: 5 }, launch_range: 5 }
    disarm_k:  { level: normal, stance: hunt, target: [kite], stand_off: { from: kestrel, hexes: 5 }, launch_range: 5 }
    # Escorts toothless: the only gun left is Kestrel. Trade shots from outside its 2-hit range
    # (one laser against three: never let the cutter close).
    duel:      { level: normal, stance: hunt, target: [kestrel], stand_off: { from: kestrel, hexes: 5 }, launch_range: 5 }
    # Engines and stern gone: it cannot move (the engine has no per-ship immobility yet: hold).
    hulk:      { level: normal, stance: hold }

  script:
    - id: rails
      when: start
      do:
        - protect: { ship: kestrel, until: end }
        - protect: { ship: wren, until: end }          # they must live to make the rams (a ram destroys the rammer regardless)
        - protect: { ship: kite, until: end }
        - protect: { ship: seed, until: crippled }     # only the rams may open it
        - orders: { ship: finch, do: [ { move_toward: seed } ] }   # the scout goes ahead
        - orders: { ship: wren,  do: [ { hold: true } ] }
        - orders: { ship: kite,  do: [ { hold: true } ] }
        - doom: { ship: finch, by_round: 6 }
        # First-contact protocol (a human rule, not a Weave mistake): guns cold until the
        # contact draws blood. Kestrel may move and scan; it opens fire once Finch is lost.
        - lock: { ship: kestrel, actions: [fire, launch], until: finch_down }
        - objective: "Scout the corridor. Guns cold: first-contact protocol."
        - bark: b1_scouts_ahead

    - id: contact
      when: { any: [ { sees: { side: player, ship: seed } }, { round: 2 } ] }
      do:
        - reveal: { ship: seed, to: player, rounds: 1 }   # no-op if already seen
        - scene: ch1_contact
        - bark: b1_contact_glyphs
        - objective: "Unknown contact. Bring it down."

    # The Seed's answer to the scout: a straight-line launch (Combat v2 launch_at) once Finch is
    # inside 7 hexes. Missiles fly at the end of the round, 6 hexes plus a 2-hex seeker, so it
    # lands the same round, before Kestrel's next turn could put a beam across its path.
    - id: missile_away
      flavor: true                                       # finch_down has the doom fallback
      when: { all: [ { any: [ { distance_below: { a: finch, b: seed, hexes: 8 } }, { round: 3 } ] }, { alive: finch } ] }
      do:
        - orders: { ship: seed, do: [ { launch_at: finch } ] }

    # and the second missile a round later if the scout is still flying
    - id: second_missile
      flavor: true
      when: { all: [ { after: { beat: missile_away, rounds: 2 } }, { alive: finch } ] }   # 2: a new orders replaces a plan that has not run yet
      do:
        - orders: { ship: seed, do: [ { launch_at: finch } ] }

    - id: seed_shield
      flavor: true                                       # a bark only; may never fire
      when: { any: [ { fired_at: { by: finch, target: seed } }, { fired_at: { by: wren, target: seed } }, { fired_at: { by: kite, target: seed } }, { fired_at: { by: kestrel, target: seed } } ] }
      do:
        - bark: b1_seed_shield

    - id: finch_hit
      flavor: true
      when: { all: [ contact, { hull_below: { ship: finch, pct: 100 } } ] }
      do:
        - bark: b1_finch_hit

    # Beat 3. The Seed's missiles kill Finch; the doom set in rails is the fallback.
    - id: finch_down
      when: { any: [ { destroyed: finch }, { round: 6 } ] }
      do:
        - scene: ch1_finch_down
        - ai: { ship: seed, profile: disarm }
        - objective: "Finch is gone. Weapons free."
        # weapons free: Wren and Kite open fire (orders). Not before: their beams would stop on the
        # Seed's missiles in flight and Finch's duel would never end on a missile.
        - orders: { ship: kite, do: [ { hold: true }, { fire_at: seed } ] }   # hold the line, fire every turn
        - orders: { ship: wren, do: [ { hold: true }, { fire_at: seed } ] }

    # Beat 4. The Seed shoots the lasers off Kite and Wren (targeted fire: disarm profiles).
    # Fallback round 9: whatever laser is still working is switched off (a Seed hit "through
    # the plating"); part_lost or the disable both count.
    - id: kite_disarmed
      when: { any: [ { part_lost: { ship: kite, part: laser } }, { flag: kite_laser_off } ] }
      do: []
    - id: wren_disarmed
      when: { any: [ { part_lost: { ship: wren, part: laser } }, { flag: wren_laser_off } ] }
      do: []
    # a competent gunner moves on to whichever escort can still shoot back
    - id: retarget_wren
      flavor: true
      when: { all: [ finch_down, kite_disarmed, { not: wren_disarmed } ] }
      do:
        - ai: { ship: seed, profile: disarm_w }
    - id: retarget_kite
      flavor: true
      when: { all: [ finch_down, wren_disarmed, { not: kite_disarmed } ] }
      do:
        - ai: { ship: seed, profile: disarm_k }
    - id: disarm_fallback
      fallback_for: weapons_gone
      when: { all: [ { round: 9 }, { not: weapons_gone } ] }
      do:
        - disable: { ship: kite, parts: [laser] }
        - disable: { ship: wren, parts: [laser] }
        - flag: kite_laser_off
        - flag: wren_laser_off

    - id: weapons_gone
      when: { all: [ finch_down, kite_disarmed, wren_disarmed ] }
      do:
        - bark: b1_weapons_gone
        - ai: { ship: seed, profile: duel }
        # toothless, they fall back on the cutter
        - orders: { ship: wren, do: [ { move_toward: kestrel } ] }
        - orders: { ship: kite, do: [ { move_toward: kestrel } ] }

    # Beat 5. Nothing left to shoot with: they turn their hulls into the weapon.
    - id: hurl
      when: { after: { beat: weapons_gone, rounds: 2 } }   # two rounds of the Seed dueling Kestrel first
      do:
        - scene: ch1_hurl
        - objective: "Wren and Kite are going in. Cover them."
        # each closes in and hurls itself once in reach (this turn's move + 2); the engine's ram
        # lands on the Seed segment nearest the rammer. Kite goes straight in (the bow faces the
        # south end of the corridor); Wren first swings up the east side to come at the stern.
        - orders: { ship: kite, do: [ { ram: seed } ] }
        - orders: { ship: wren, do: [ { move_to: [1, -1] }, { ram: seed } ] }

    # Beat 6. The two rams. The engine lands each one on the Seed segment nearest the rammer and
    # destroys the rammer. Which end each takes is geometry (see MANIFEST.md assumptions). Fallback: 3 rounds after the
    # hurl, a rammer still flying is hurled regardless of distance (`force: true`).
    - id: ram_wren
      when: { rammed: wren }
      do:
        - bark: b1_hurl_wren
    - id: ram_kite
      when: { rammed: kite }
      do:
        - bark: b1_hurl_kite
    - id: ram_fallback
      fallback_for: crippled
      when: { all: [ { after: { beat: hurl, rounds: 3 } }, { not: { all: [ ram_wren, ram_kite ] } } ] }
      do:
        - ram: { ship: wren, target: seed, force: true }   # a no-op for a ship that already rammed (gone)
        - ram: { ship: kite, target: seed, force: true }

    - id: seed_closing
      flavor: true
      when: { all: [ weapons_gone, { distance_below: { a: seed, b: kestrel, hexes: 6 } }, { not: crippled } ] }
      do:
        - bark: b1_seed_closing

    # Beat 7. Crippled: the core is all that is left. Kestrel's next hit kills it.
    - id: crippled
      when: { all: [ ram_wren, ram_kite ] }
      do:
        - unprotect: seed
        - disable: { ship: seed, parts: [engine, laser, launcher] }   # guarantee: whatever survived the rams is dead weight
        - ai: { ship: seed, profile: hulk }
        - objective: "It's drifting. Finish it."
    - id: finish_fallback
      fallback_for: win
      when: { all: [ { after: { beat: crippled, rounds: 3 } }, { alive: seed } ] }
      do:
        - damage: { ship: seed, seg: 0, hits: 3, cause: scripted }   # the core burns out

  win:  [ { destroyed: seed } ]
  lose: [ { destroyed: kestrel } ]  # unreachable (protected) but kept, with a retry scene
  scenes: { intro: ch1_intro, win: [ch1_victory, ch1_salvage], lose: ch1_defeat }
  rewards:
    capabilities: [launcher, magazine, missile, mine]   # mine = the survey charges the engineer rigs in ch2
    roster_remove: [finch, wren, kite]                  # none of the escorts came home
    roster_add: [sparrow]                               # Sparrow joins at the salvage (ch2 on)
    # Kestrel flies kestrel@ch2 next chapter (the loader picks hulls by <id>@<chapter>)
