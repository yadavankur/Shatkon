# ============================================================
#  BOARD: The Strait
#
#  One gap, three hexes wide, in a wall of rock. A shielded fleet holds the far side. Lasers do not pass through rock, so every shot goes through the gap.
#
#  Try: Do not feed ships through one at a time. Mass on your side of the gap, shoot down the nearest shield two turns running (shields only return after a round unhit), then go through together.
#
#  You are player_1 (south). The computer is player_2 (north).
#  Open it at  play.html?board=04_the_strait   Edit anything here and reload.
# ============================================================

board:
  name: "The Strait"
  idea: "One gap, three hexes wide, in a wall of rock. A shielded fleet holds the far side. Lasers do not pass through rock, so every shot goes through the gap."
  try: "Do not feed ships through one at a time. Mass on your side of the gap, shoot down the nearest shield two turns running (shields only return after a round unhit), then go through together."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "defensive"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "The Strait"
  board: { shape: hexagon, radius: 8 }
  zones:
    player_1_home: { edge: south, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: asteroid, at: [-8, 0], size: 1 }
    - { type: asteroid, at: [-7, 0], size: 1 }
    - { type: asteroid, at: [-6, 0], size: 1 }
    - { type: asteroid, at: [-5, 0], size: 1 }
    - { type: asteroid, at: [-4, 0], size: 1 }
    - { type: asteroid, at: [-3, 0], size: 1 }
    - { type: asteroid, at: [-2, 0], size: 1 }
    - { type: asteroid, at: [2, 0], size: 1 }
    - { type: asteroid, at: [3, 0], size: 1 }
    - { type: asteroid, at: [4, 0], size: 1 }
    - { type: asteroid, at: [5, 0], size: 1 }
    - { type: asteroid, at: [6, 0], size: 1 }
    - { type: asteroid, at: [7, 0], size: 1 }
    - { type: asteroid, at: [8, 0], size: 1 }

player_1:
  ships:
    - name: "Anvil"                # brawler
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, comms] }
        - { at: [1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [0, 1], bays: [engine, coupling, stealth] }
    - name: "Hammer"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Tongs"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Rivet"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
  deployment:
    - { ship: "Anvil", at: [-3, 6] }
    - { ship: "Hammer", at: [-8, 7] }
    - { ship: "Tongs", at: [0, 7] }
    - { ship: "Rivet", at: [-7, 6] }

player_2:
  ships:
    - name: "Keep"                # bastion
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, comms], mounts: [shield, armour, point_defence] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
    - name: "Gate"                # shieldboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, shield, armour] }
    - name: "Bar"                # shieldboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, shield, armour] }
    - name: "Arrow"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
  deployment:
    - { ship: "Keep", at: [3, -6] }
    - { ship: "Gate", at: [7, -7] }
    - { ship: "Bar", at: [1, -7] }
    - { ship: "Arrow", at: [7, -6] }
