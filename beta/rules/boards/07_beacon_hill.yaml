# ============================================================
#  BOARD: Beacon Hill
#
#  A beacon in a nebula at the centre. Hold it through the other side's turn to score; 5 points wins. Holding it shows everyone where you are.
#
#  Try: The first ship on the beacon is a target. Send the courier to take the first point cheaply, and have your guns covering the hexes the enemy must use to push you off.
#
#  You are player_1 (south). The computer is player_2 (north).
#  Open it at  play.html?board=07_beacon_hill   Edit anything here and reload.
# ============================================================

board:
  name: "Beacon Hill"
  idea: "A beacon in a nebula at the centre. Hold it through the other side's turn to score; 5 points wins. Holding it shows everyone where you are."
  try: "The first ship on the beacon is a target. Send the courier to take the first point cheaply, and have your guns covering the hexes the enemy must use to push you off."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "balanced"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "Beacon Hill"
  board: { shape: hexagon, radius: 8 }
  zones:
    player_1_home: { edge: south, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  objective: { at: [0, 0], radius: 1, points_to_win: 5, reveals_holder: true, decides_turn_limit: true }
  terrain:
    - { type: nebula, at: [0, 0], radius: 2 }
    - { type: asteroid, at: [-4, 2], size: 1 }
    - { type: asteroid, at: [4, -2], size: 1 }
    - { type: asteroid, at: [2, 3], size: 1 }
    - { type: asteroid, at: [-2, -3], size: 1 }

player_1:
  ships:
    - name: "Beacon"                # small_flagship
      flagship: true
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, magazine, sensor] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }
    - name: "Flint"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Quiver"                # missile_boat
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, engine, magazine], mounts: [launcher] }
        - { at: [1, 0], bays: [coupling, engine, sensor], mounts: [launcher, armour] }
    - name: "Swift"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Beacon", at: [-3, 6] }
    - { ship: "Flint", at: [-7, 7] }
    - { ship: "Quiver", at: [-1, 7] }
    - { ship: "Swift", at: [-8, 5] }

player_2:
  ships:
    - name: "Pyre"                # small_flagship
      flagship: true
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, magazine, sensor] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }
    - name: "Cinder"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Sling"                # missile_boat
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, engine, magazine], mounts: [launcher] }
        - { at: [1, 0], bays: [coupling, engine, sensor], mounts: [launcher, armour] }
    - name: "Gnat"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Pyre", at: [3, -6] }
    - { ship: "Cinder", at: [7, -7] }
    - { ship: "Sling", at: [1, -7] }
    - { ship: "Gnat", at: [8, -5] }
