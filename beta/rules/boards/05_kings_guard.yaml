# ============================================================
#  BOARD: King's Guard
#
#  Chess: each flagship is a king with no weapons at all. Two gunboats, a sniper and a courier do the fighting. Lose the king and you lose.
#
#  Try: Decide what guards the king and what hunts. A king left alone dies to one gunboat; a king hidden in the nebula with a guard is hard to find. Use the courier to find theirs first.
#
#  You are player_1 (south). The computer is player_2 (north).
#  Open it at  play.html?board=05_kings_guard   Edit anything here and reload.
# ============================================================

board:
  name: "King's Guard"
  idea: "Chess: each flagship is a king with no weapons at all. Two gunboats, a sniper and a courier do the fighting. Lose the king and you lose."
  try: "Decide what guards the king and what hunts. A king left alone dies to one gunboat; a king hidden in the nebula with a guard is hard to find. Use the courier to find theirs first."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "balanced"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "King's Guard"
  board: { shape: hexagon, radius: 8 }
  zones:
    player_1_home: { edge: south, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: nebula, at: [0, 0], radius: 1 }
    - { type: nebula, at: [-5, 6], radius: 1 }
    - { type: nebula, at: [5, -6], radius: 1 }
    - { type: asteroid, at: [-4, 1], size: 1 }
    - { type: asteroid, at: [4, -1], size: 1 }
    - { type: asteroid, at: [3, 2], size: 1 }
    - { type: asteroid, at: [-3, -2], size: 1 }

player_1:
  ships:
    - name: "Crown"                # king
      flagship: true
      hull:
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
        - { at: [0, 0], bays: [core, comms, sensor], mounts: [point_defence, armour] }
        - { at: [1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
    - name: "Rook"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Castle"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Bishop"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Knight"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Crown", at: [-4, 7] }
    - { ship: "Rook", at: [-6, 6] }
    - { ship: "Castle", at: [0, 6] }
    - { ship: "Bishop", at: [-7, 5] }
    - { ship: "Knight", at: [2, 5] }

player_2:
  ships:
    - name: "Throne"                # king
      flagship: true
      hull:
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
        - { at: [0, 0], bays: [core, comms, sensor], mounts: [point_defence, armour] }
        - { at: [1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
    - name: "Tower"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Wall"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Mitre"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Horse"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Throne", at: [4, -7] }
    - { ship: "Tower", at: [6, -6] }
    - { ship: "Wall", at: [0, -6] }
    - { ship: "Mitre", at: [7, -5] }
    - { ship: "Horse", at: [-2, -5] }
