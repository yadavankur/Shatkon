# ============================================================
#  BOARD: King's Guard
#
#  Chess, from the side: each flagship is a king with no weapons. The two fleets start on
#  neighbouring edges, close at the corner and far apart at the ends, and each king sits at the far
#  end of its line. Lose the king and you lose.
#
#  Try: The corner is where the fight starts, not where it is won. Hold the corner with one gunboat
#  and send the rest the long way round the centre to the king. The Knight (a Comet, 8 hexes a
#  turn) finds their king in one turn; it will not live to do it twice.
#
#  You are player_1 (south edge). The computer is player_2. The computer is on the south-west edge.
#  The board is a mirror image across the corner.
#  Open it at  play.html?board=05_kings_guard   Edit anything here and reload.
#
#  Design notes (maps-rework): was north against south like the rest. Now a flank start on
#  neighbouring edges, mirrored across the line through the shared corner, and the courier became a
#  Comet.
# ============================================================

board:
  name: "King's Guard"
  idea: "Chess, from the side: each flagship is a king with no weapons. The two fleets start on neighbouring edges, close at the corner and far apart at the ends, and each king sits at the far end of its line. Lose the king and you lose."
  try: "The corner is where the fight starts, not where it is won. Hold the corner with one gunboat and send the rest the long way round the centre to the king. The Knight (a Comet, 8 hexes a turn) finds their king in one turn; it will not live to do it twice."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "balanced"
    ai.personalities.runner: { note: "a scout: runs ahead of the fleet on its own", range: [3, 4], keep_together: 0, missile_range: 8, attack_run: true, unarmed_ships: "bait" }

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "King's Guard"
  board: { shape: hexagon, radius: 8 }
  zones:
    player_1_home: { edge: south, depth: 3 }
    player_2_home: { edge: south_west, depth: 3 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: asteroid, at: [-6, 6], size: 7 }
    - { type: asteroid, at: [-4, 4], size: 1 }
    - { type: nebula, at: [-1, 1], radius: 1 }
    - { type: nebula, at: [2, 3], radius: 1 }
    - { type: nebula, at: [-3, -2], radius: 1 }
    - { type: asteroid, at: [1, -1], size: 1 }
    - { type: asteroid, at: [3, 0], size: 1 }
    - { type: asteroid, at: [0, -3], size: 1 }

player_1:
  ships:
    - name: "Crown"                # king (no weapons)
      flagship: true
      hull:
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
        - { at: [0, 0], bays: [core, comms, sensor], mounts: [point_defence, armour] }
        - { at: [1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
    - name: "Castle"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Rook"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Bishop"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Knight"                # NEW comet: afterburner scout, 8 hexes a turn, flash 5 when it dies
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, afterburner, sensor] }
  deployment:
    - { ship: "Crown", at: [0, 7] }
    - { ship: "Castle", at: [1, 6] }
    - { ship: "Rook", at: [-2, 8] }
    - { ship: "Bishop", at: [-2, 6] }
    - { ship: "Knight", at: [-3, 7] }

player_2:
  ships:
    - name: "Throne"                # king (no weapons)
      flagship: true
      hull:
        - { at: [0, 1], bays: [engine, coupling, stealth], mounts: [armour, shield] }
        - { at: [0, 0], bays: [core, comms, sensor], mounts: [point_defence, armour] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour, shield] }
    - name: "Tower"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [0, -1], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Wall"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [0, -1], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Mitre"                # sniper
      hull:
        - { at: [0, 1], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [0, -1], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Horse"                # NEW comet: afterburner scout, 8 hexes a turn, flash 5 when it dies
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, afterburner, sensor] }
  deployment:
    - { ship: "Throne", at: [-7, 0] }
    - { ship: "Tower", at: [-6, -1] }
    - { ship: "Wall", at: [-8, 2] }
    - { ship: "Mitre", at: [-6, 2] }
    - { ship: "Horse", at: [-7, 3] }
