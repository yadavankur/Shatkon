player_1:
  ships:
    - name: "Ram"                # brawler
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, comms] }
        - { at: [1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [0, 1], bays: [engine, coupling, stealth] }
    - name: "Hive"                # NEW carrier: launches seeker drones that wander and report
      load: { seeker_drone: 4 }
      hull:
        - { at: [0, 1], bays: [coupling, magazine, engine], mounts: [launcher, armour] }
        - { at: [0, 0], bays: [core, magazine, sensor], mounts: [shield] }
        - { at: [0, -1], bays: [coupling, engine, engine], mounts: [launcher, armour] }
    - name: "Hammer"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [0, -1], bays: [coupling, engine, engine], mounts: [laser, armour] }
  deployment:
    - { ship: "Ram", at: [-8, 4] }
    - { ship: "Hive", at: [-8, 8] }
    - { ship: "Hammer", at: [-7, 1] }

