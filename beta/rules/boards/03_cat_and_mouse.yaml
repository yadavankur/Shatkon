# ============================================================
#  BOARD: Cat and Mouse
#
#  Late-campaign stealth: every stealth part hides twice as much and cores see 1 hex. Fleets can pass within two hexes and never know. Each side has two couriers.
#
#  Try: Run the couriers ahead and scan with them; they relay what they see. A courier that is shot down lights up everything within 3 hexes of it, and the ship that shot it. Fire first: a laser hit lights up the shooter.
#
#  You are player_1 (south). The computer is player_2 (north).
#  Open it at  play.html?board=03_cat_and_mouse   Edit anything here and reload.
# ============================================================

board:
  name: "Cat and Mouse"
  idea: "Late-campaign stealth: every stealth part hides twice as much and cores see 1 hex. Fleets can pass within two hexes and never know. Each side has two couriers."
  try: "Run the couriers ahead and scan with them; they relay what they see. A courier that is shot down lights up everything within 3 hexes of it, and the ship that shot it. Fire first: a laser hit lights up the shooter."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    bay_parts.stealth.hides: 2
    detection.stealth_floor_segments_per_point: 7
    bay_parts.core.sensor_range: 1
    ai.vs_computer: "balanced"
    ai.personalities.runner: { note: "a courier: runs ahead of the fleet on its own", range: [3, 4], keep_together: 0, missile_range: 8, attack_run: true, unarmed_ships: "bait" }

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "Cat and Mouse"
  board: { shape: hexagon, radius: 10 }
  zones:
    player_1_home: { edge: south, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: nebula, at: [0, 0], radius: 2 }
    - { type: nebula, at: [-6, 3], radius: 2 }
    - { type: nebula, at: [6, -3], radius: 2 }
    - { type: asteroid, at: [-3, -1], size: 3 }
    - { type: asteroid, at: [3, 1], size: 3 }

player_1:
  ships:
    - name: "Nightjar"                # shadow
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, stealth] }
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [laser, armour] }
        - { at: [1, -1], bays: [engine, coupling, stealth], mounts: [laser, point_defence] }
    - name: "Hush"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Murmur"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Swift"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
    - name: "Wren"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Nightjar", at: [-4, 8] }
    - { ship: "Hush", at: [-9, 9] }
    - { ship: "Murmur", at: [-1, 9] }
    - { ship: "Swift", at: [-10, 7] }
    - { ship: "Wren", at: [2, 7] }

player_2:
  ships:
    - name: "Owl"                # shadow
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, stealth] }
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [laser, armour] }
        - { at: [1, -1], bays: [engine, coupling, stealth], mounts: [laser, point_defence] }
    - name: "Veil"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Shade"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Gnat"                # dart
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
    - name: "Midge"                # dart
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Owl", at: [4, -8] }
    - { ship: "Veil", at: [9, -9] }
    - { ship: "Shade", at: [1, -9] }
    - { ship: "Gnat", at: [10, -7] }
    - { ship: "Midge", at: [-2, -7] }
