# ============================================================
#  BOARD: Cat and Mouse
#
#  You are the cat. A stealth fleet (every stealth part hides twice as much, cores see 1 hex) hides
#  somewhere on the biggest board. You have three Comets: 8 hexes a turn, nothing else, and they
#  light up everything within 5 hexes when they die.
#
#  Try: A Comet is meant to be lost. Throw one through a nebula bank: if it dies, the flash shows
#  you everything within 5 hexes and the ship that shot it, so have the Hounds (two lasers each)
#  within reach of where it will die. Tom, your flagship, has no guns but a 12-hex comms link.
#  Never send all three Comets at once.
#
#  You are player_1 (south edge). The computer is player_2. The computer is the mouse, on the north
#  edge.
#  Open it at  play.html?board=03_cat_and_mouse   Edit anything here and reload.
#
#  Design notes (maps-rework): both sides had the same stealth fleet; now it is a hunt. The Comet
#  (afterburner part, defined in this file) is the super-fast scout from Ankur's idea, built from
#  existing rules: own_move 8, evades_beyond 2, death_flash 5.
#
#  The afterburner part now lives in world_v0.4.yaml (reveals as it flies, burns out after 3 turns).
#  The world limit is 2 Comets a fleet (a maps-bot suggestion, not a fixed rule); this board raises
#  it to 3 with bay_parts.afterburner.max_per_fleet in rules: below.
# ============================================================

board:
  name: "Cat and Mouse"
  idea: "You are the cat. A stealth fleet (every stealth part hides twice as much, cores see 1 hex) hides somewhere on the biggest board. You have three Comets: 8 hexes a turn, nothing else, and they light up everything within 5 hexes when they die."
  try: "A Comet is meant to be lost. Throw one through a nebula bank: if it dies, the flash shows you everything within 5 hexes and the ship that shot it, so have the Hounds (two lasers each) within reach of where it will die. Tom, your flagship, has no guns but a 12-hex comms link. Never send all three Comets at once."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    bay_parts.stealth.hides: 2
    detection.stealth_floor_segments_per_point: 7
    bay_parts.core.sensor_range: 1
    bay_parts.afterburner.max_per_fleet: 3    # world default is 2 a fleet (a maps-bot suggestion); this board is built around three
    ai.vs_computer: "balanced"
    ai.personalities.runner: { note: "a scout: runs ahead of the fleet on its own", range: [3, 4], keep_together: 0, missile_range: 8, attack_run: true, unarmed_ships: "bait" }

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "Cat and Mouse"
  board: { shape: hexagon, radius: 11 }
  zones:
    player_1_home: { edge: south, depth: 3 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: nebula, at: [0, -2], radius: 2 }
    - { type: nebula, at: [-6, 1], radius: 2 }
    - { type: nebula, at: [6, -5], radius: 2 }
    - { type: nebula, at: [-3, -6], radius: 1 }
    - { type: asteroid, at: [-3, 2], size: 3 }
    - { type: asteroid, at: [4, 0], size: 3 }
    - { type: asteroid, at: [0, 4], size: 1 }
    - { type: asteroid, at: [7, -9], size: 1 }
    - { type: asteroid, at: [-8, -2], size: 1 }

player_1:
  ships:
    - name: "Tom"                # king (no weapons)
      flagship: true
      ai: defensive
      hull:
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
        - { at: [0, 0], bays: [core, comms, sensor], mounts: [point_defence, armour] }
        - { at: [1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
    - name: "Bloodhound"                # NEW hound: a gunboat that gives up an engine for a second sensor (sees 6)
      hull:
        - { at: [0, 0], bays: [core, sensor, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Foxhound"                # NEW hound: a gunboat that gives up an engine for a second sensor (sees 6)
      hull:
        - { at: [0, 0], bays: [core, sensor, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Deerhound"                # NEW hound: a gunboat that gives up an engine for a second sensor (sees 6)
      hull:
        - { at: [0, 0], bays: [core, sensor, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Comet 1"                # NEW comet: afterburner scout, 8 hexes a turn, flash 5 when it dies
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, afterburner, sensor] }
    - name: "Comet 2"                # NEW comet: afterburner scout, 8 hexes a turn, flash 5 when it dies
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, afterburner, sensor] }
    - name: "Comet 3"                # NEW comet: afterburner scout, 8 hexes a turn, flash 5 when it dies
      ai: runner
      hull:
        - { at: [0, 0], bays: [core, afterburner, sensor] }
  deployment:
    - { ship: "Tom", at: [-3, 10] }
    - { ship: "Bloodhound", at: [-7, 10] }
    - { ship: "Foxhound", at: [-1, 10] }
    - { ship: "Deerhound", at: [-6, 9] }
    - { ship: "Comet 1", at: [-9, 10] }
    - { ship: "Comet 2", at: [-4, 9] }
    - { ship: "Comet 3", at: [1, 9] }

player_2:
  ships:
    - name: "Owl"                # shadow
      flagship: true
      ai: defensive
      hull:
        - { at: [0, 0], bays: [core, sensor, stealth] }
        - { at: [1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [0, 1], bays: [engine, coupling, stealth], mounts: [laser, armour] }
        - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [laser, point_defence] }
    - name: "Veil"                # sniper
      ai: defensive
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Shade"                # sniper
      ai: defensive
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
  deployment:
    - { ship: "Owl", at: [3, -9] }
    - { ship: "Veil", at: [8, -10] }
    - { ship: "Shade", at: [-2, -8] }
