# ============================================================
#  BOARD: Pawn Storm
#
#  Encircled. One dreadnought with six shields sits in the middle of a broken ring of rock. Six
#  one-laser skiffs surround it on every side, with a small flagship. It moves 2 hexes a turn and
#  can only chase one of you.
#
#  Try: A shield soaks the first hit on its segment each round. Two skiffs on the SAME segment in
#  one turn: the second shot gets through. Hit it from opposite sides so it cannot back away from
#  both; the skiff it chases should run, not fight.
#
#  You are player_1 (all round the edge). The computer is player_2. The computer's dreadnought
#  starts in the centre.
#  Open it at  play.html?board=06_pawn_storm   Edit anything here and reload.
#
#  Design notes (maps-rework): was a skiff line against a dreadnought from the far edge. Now an
#  encirclement: player 1 may deploy anywhere, player 2 only on the north half; the ring rocks give
#  the dreadnought cover from some angles and none from others.
# ============================================================

board:
  name: "Pawn Storm"
  idea: "Encircled. One dreadnought with six shields sits in the middle of a broken ring of rock. Six one-laser skiffs surround it on every side, with a small flagship. It moves 2 hexes a turn and can only chase one of you."
  try: "A shield soaks the first hit on its segment each round. Two skiffs on the SAME segment in one turn: the second shot gets through. Hit it from opposite sides so it cannot back away from both; the skiff it chases should run, not fight."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "aggressive"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "Pawn Storm"
  board: { shape: hexagon, radius: 8 }
  zones:
    player_1_home: { edge: south, depth: 17 }
    player_2_home: { edge: north, depth: 10 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: asteroid, at: [2, 1], size: 1 }
    - { type: asteroid, at: [-1, 3], size: 1 }
    - { type: asteroid, at: [-3, 2], size: 1 }
    - { type: asteroid, at: [-2, -1], size: 1 }
    - { type: asteroid, at: [1, -3], size: 1 }
    - { type: asteroid, at: [3, -2], size: 1 }

player_1:
  ships:
    - name: "Queenside"                # command corvette
      flagship: true
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, magazine, sensor], mounts: [armour, shield] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }
    - name: "Pawn a"                # skiff
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
    - name: "Pawn b"                # skiff
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
    - name: "Pawn c"                # skiff
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
    - name: "Pawn d"                # skiff
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
    - name: "Pawn e"                # skiff
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
    - name: "Pawn f"                # skiff
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
  deployment:
    - { ship: "Queenside", at: [-4, 8] }
    - { ship: "Pawn a", at: [7, -1] }
    - { ship: "Pawn b", at: [-1, 7] }
    - { ship: "Pawn c", at: [-7, 1] }
    - { ship: "Pawn d", at: [1, -7] }
    - { ship: "Pawn e", at: [6, -7] }
    - { ship: "Pawn f", at: [-6, 7] }

player_2:
  ships:
    - name: "Leviathan"                # dreadnought
      flagship: true
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, sensor, magazine] }
        - { at: [1, 0], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, shield, point_defence] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, armour, shield] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
        - { at: [-1, 1], bays: [engine, engine, coupling], mounts: [laser, shield, point_defence] }
        - { at: [0, 1], bays: [engine, engine, coupling], mounts: [launcher, armour, shield] }
  deployment:
    - { ship: "Leviathan", at: [0, 0] }
