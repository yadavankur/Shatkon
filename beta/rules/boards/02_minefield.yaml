# ============================================================
#  BOARD: The Minefield
#
#  A wall of rock with three gaps. The computer waits behind it and has mined the way through: two proximity mines and a contact mine. One gap is clean.
#
#  Try: Send a courier (5 hexes a turn) up to the wall and scan: a scan is the only thing that shows a mine. Then take the fleet through the clean gap. Lose a courier next to the enemy and its flash shows you where they are.
#
#  You are player_1 (south). The computer is player_2 (north).
#  Open it at  play.html?board=02_minefield   Edit anything here and reload.
# ============================================================

board:
  name: "The Minefield"
  idea: "A wall of rock with three gaps. The computer waits behind it and has mined the way through: two proximity mines and a contact mine. One gap is clean."
  try: "Send a courier (5 hexes a turn) up to the wall and scan: a scan is the only thing that shows a mine. Then take the fleet through the clean gap. Lose a courier next to the enemy and its flash shows you where they are."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "defensive"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "The Minefield"
  board: { shape: hexagon, radius: 8 }
  zones:
    player_1_home: { edge: south, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 6 }
  terrain:
    - { type: asteroid, at: [-8, 0], size: 1 }
    - { type: asteroid, at: [-7, 0], size: 1 }
    - { type: asteroid, at: [-6, 0], size: 1 }
    - { type: asteroid, at: [-3, 0], size: 1 }
    - { type: asteroid, at: [-2, 0], size: 1 }
    - { type: asteroid, at: [-1, 0], size: 1 }
    - { type: asteroid, at: [2, 0], size: 1 }
    - { type: asteroid, at: [3, 0], size: 1 }
    - { type: asteroid, at: [6, 0], size: 1 }
    - { type: asteroid, at: [7, 0], size: 1 }
    - { type: asteroid, at: [8, 0], size: 1 }

player_1:
  ships:
    - name: "Pathfinder"                # small_flagship
      flagship: true
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, magazine, sensor] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }
    - name: "Mallet"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Lookout"                # seeker
      hull:
        - { at: [0, 0], bays: [core, sensor, sensor], mounts: [laser] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, point_defence] }
    - name: "Swift"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
    - name: "Wren"                # dart
      hull:
        - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  deployment:
    - { ship: "Pathfinder", at: [-3, 6] }
    - { ship: "Mallet", at: [-7, 7] }
    - { ship: "Lookout", at: [-1, 7] }
    - { ship: "Swift", at: [-8, 5] }
    - { ship: "Wren", at: [2, 5] }

player_2:
  ships:
    - name: "Warden"                # flagship
      flagship: true
      load: { missile: 2 }
      hull:
        - { at: [0, 0], bays: [core, magazine, comms] }
        - { at: [1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [launcher, point_defence] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [-1, 0], bays: [engine, coupling, stealth] }
        - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [0, 1], bays: [engine, coupling, stealth] }
    - name: "Bolt"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
    - name: "Latch"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
  deployment:
    - { ship: "Warden", at: [3, -6] }
    - { ship: "Bolt", at: [7, -7] }
    - { ship: "Latch", at: [0, -7] }
    - { naval_mine: [-4, 0] }
    - { naval_mine: [1, 0] }
    - { mine: [5, -2] }
