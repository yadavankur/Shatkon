# ============================================================
#  BOARD: The Gambit
#
#  A hidden fleet of snipers stands off in the dark and will not come to you. You have three worthless decoys. A ship that hits something lights itself up.
#
#  Try: Give up a decoy on purpose: run it at where you think they are. The sniper that shoots it shows itself for a round, and your own snipers are in range behind. A gambit only works if the guns are already in place.
#
#  You are player_1 (south). The computer is player_2 (north).
#  Open it at  play.html?board=10_gambit   Edit anything here and reload.
# ============================================================

board:
  name: "The Gambit"
  idea: "A hidden fleet of snipers stands off in the dark and will not come to you. You have three worthless decoys. A ship that hits something lights itself up."
  try: "Give up a decoy on purpose: run it at where you think they are. The sniper that shoots it shows itself for a round, and your own snipers are in range behind. A gambit only works if the guns are already in place."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "defensive"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "The Gambit"
  board: { shape: hexagon, radius: 9 }
  zones:
    player_1_home: { edge: south, depth: 5 }
    player_2_home: { edge: north, depth: 5 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: nebula, at: [-3, -4], radius: 2 }
    - { type: nebula, at: [4, -5], radius: 2 }
    - { type: asteroid, at: [0, 0], size: 3 }
    - { type: asteroid, at: [-5, 2], size: 1 }
    - { type: asteroid, at: [5, -1], size: 1 }

player_1:
  ships:
    - name: "Patron"                # flagship
      flagship: true
      load: { missile: 2 }
      hull:
        - { at: [0, 0], bays: [core, magazine, comms] }
        - { at: [1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [launcher, point_defence] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [-1, 0], bays: [engine, coupling, stealth] }
        - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [armour] }
        - { at: [0, 1], bays: [engine, coupling, stealth] }
    - name: "Hush"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Murmur"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Lure 1"                # decoy
      hull:
        - { at: [0, 0], bays: [core, engine] }
    - name: "Lure 2"                # decoy
      hull:
        - { at: [0, 0], bays: [core, engine] }
    - name: "Lure 3"                # decoy
      hull:
        - { at: [0, 0], bays: [core, engine] }
  deployment:
    - { ship: "Patron", at: [-4, 7] }
    - { ship: "Hush", at: [-8, 8] }
    - { ship: "Murmur", at: [0, 8] }
    - { ship: "Lure 1", at: [-5, 5] }
    - { ship: "Lure 2", at: [-3, 5] }
    - { ship: "Lure 3", at: [-1, 5] }

player_2:
  ships:
    - name: "Owl"                # shadow
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, stealth] }
        - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [laser, armour] }
        - { at: [1, -1], bays: [engine, coupling, stealth], mounts: [laser, point_defence] }
    - name: "Veil"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Shade"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Moth"                # scout
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [armour] }
        - { at: [0, 0], bays: [core, engine, coupling] }
        - { at: [1, 0], bays: [sensor, engine, stealth], mounts: [laser] }
  deployment:
    - { ship: "Owl", at: [4, -7] }
    - { ship: "Veil", at: [8, -8] }
    - { ship: "Shade", at: [0, -8] }
    - { ship: "Moth", at: [8, -7] }
