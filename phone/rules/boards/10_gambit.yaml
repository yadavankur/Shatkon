# ============================================================
#  BOARD: The Gambit
#
#  Salvo against decoy. A hidden fleet of snipers stands off in the dark with a Volley boat: three
#  launchers that fire on one order, so the first ship it sees eats a salvo. You have three
#  worthless Lures.
#
#  Try: Feed the salvo a Lure. Run one ahead where you think they are: if the Volley fires at it,
#  that is three missiles gone, and the launch flare shows you the Volley. Point defence on the
#  Patron stops one missile, not three. A gambit only works if your snipers are already in range
#  behind the Lure.
#
#  You are player_1 (south-east edge). The computer is player_2. The computer is on the north edge,
#  at an angle to you.
#  Open it at  play.html?board=10_gambit   Edit anything here and reload.
#
#  Design notes (maps-rework): was north against south with snipers only. Now an angled start and
#  the salvo-versus-decoy test Ankur asked for (salvoes make the first sighting decisive; a cheap
#  decoy should be the answer).
#
#  Needs a new rule to play as designed: a decoy emitter part (adds_signature: 3, lures_missiles:
#  true) so a Lure looks like a big ship to sensors and missile seekers; today a Lure only works
#  when it is the only thing they can see.
# ============================================================

board:
  name: "The Gambit"
  idea: "Salvo against decoy. A hidden fleet of snipers stands off in the dark with a Volley boat: three launchers that fire on one order, so the first ship it sees eats a salvo. You have three worthless Lures."
  try: "Feed the salvo a Lure. Run one ahead where you think they are: if the Volley fires at it, that is three missiles gone, and the launch flare shows you the Volley. Point defence on the Patron stops one missile, not three. A gambit only works if your snipers are already in range behind the Lure."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "defensive"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "The Gambit"
  board: { shape: hexagon, radius: 9 }
  zones:
    player_1_home: { edge: south_east, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: nebula, at: [-3, -4], radius: 2 }
    - { type: nebula, at: [4, -6], radius: 2 }
    - { type: asteroid, at: [0, 0], size: 7 }
    - { type: asteroid, at: [-5, 2], size: 3 }
    - { type: asteroid, at: [5, -1], size: 1 }
    - { type: asteroid, at: [2, 3], size: 1 }

player_1:
  ships:
    - name: "Patron"                # command corvette
      flagship: true
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, magazine, sensor], mounts: [armour, shield] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }
    - name: "Hush"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Murmur"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Lure 1"                # decoy
      hull:
        - { at: [0, 0], bays: [core, engine, emitter] }
    - name: "Lure 2"                # decoy
      hull:
        - { at: [0, 0], bays: [core, engine, emitter] }
    - name: "Lure 3"                # decoy
      hull:
        - { at: [0, 0], bays: [core, engine, emitter] }
  deployment:
    - { ship: "Patron", at: [4, 4] }
    - { ship: "Hush", at: [7, 1] }
    - { ship: "Murmur", at: [1, 7] }
    - { ship: "Lure 1", at: [2, 4] }
    - { ship: "Lure 2", at: [4, 2] }
    - { ship: "Lure 3", at: [3, 5] }

player_2:
  ships:
    - name: "Owl"                # shadow
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, stealth] }
        - { at: [1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
        - { at: [0, 1], bays: [engine, coupling, stealth], mounts: [laser, armour] }
        - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [laser, point_defence] }
    - name: "Veil"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Shade"                # sniper
      hull:
        - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
        - { at: [0, 0], bays: [core, sensor, sensor] }
        - { at: [1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
    - name: "Volley"                # NEW volley: salvo boat, three launchers fire on one order
      load: { missile: 6 }
      hull:
        - { at: [-1, 0], bays: [coupling, magazine, engine], mounts: [launcher, armour] }
        - { at: [0, 0], bays: [core, magazine, sensor], mounts: [launcher, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [launcher, armour] }
  deployment:
    - { ship: "Owl", at: [1, -7] }
    - { ship: "Veil", at: [5, -7] }
    - { ship: "Shade", at: [-2, -6] }
    - { ship: "Volley", at: [0, -8] }
