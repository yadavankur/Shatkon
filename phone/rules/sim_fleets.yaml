# ============================================================
#  TEST FLEETS  -  ship designs and fleets for tools/scenarios.mjs
#
#  Not part of the game (it is not listed in index.yaml): this is the
#  library the simulations draw on to pit different kinds of fleet
#  against each other. Add a design or a fleet here and it joins the
#  next run. Parts and prices come from world_v0.4.yaml.
# ============================================================

designs:

  # ---- the two ships of the stock game ----
  scout:                       # small, quiet, one laser (the stock "Blob A")
    hull:
      - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [armour] }
      - { at: [0, 0],  bays: [core, engine, coupling] }
      - { at: [1, 0],  bays: [sensor, engine, stealth], mounts: [laser] }
  flagship:                    # the stock "Blob B": 7 segments, one laser, 2 missiles, point defence
    load: { missile: 2 }
    hull:
      - { at: [0, 0],  bays: [core, magazine, comms] }
      - { at: [1, 0],  bays: [engine, engine, coupling], mounts: [laser, shield] }
      - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [launcher, point_defence] }
      - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour] }
      - { at: [-1, 0], bays: [engine, coupling, stealth] }
      - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [armour] }
      - { at: [0, 1],  bays: [engine, coupling, stealth] }

  # ---- cheap ships ----
  decoy:                       # a core and an engine: nothing to shoot with, nearly free
    hull:
      - { at: [0, 0], bays: [core, engine] }
  picket:                      # eyes only: sensor 4, signature 1
    hull:
      - { at: [0, 0], bays: [core, sensor, engine] }

  # ---- escorts ----
  gunboat:                     # two lasers, a shield and armour
    hull:
      - { at: [0, 0], bays: [core, engine, sensor],     mounts: [laser, shield] }
      - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
  missile_boat:                # two launchers, 3 missiles, no gun
    load: { missile: 3 }
    hull:
      - { at: [0, 0], bays: [core, engine, magazine],   mounts: [launcher] }
      - { at: [1, 0], bays: [coupling, engine, sensor], mounts: [launcher, armour] }
  sniper:                      # sees 6 hexes, signature 1, two lasers
    hull:
      - { at: [-1, 0], bays: [engine, stealth, coupling], mounts: [laser] }
      - { at: [0, 0],  bays: [core, sensor, sensor] }
      - { at: [1, 0],  bays: [engine, stealth, coupling], mounts: [laser] }

  # ---- other flagships ----
  brawler:                     # 7 segments, three lasers, three shields, no missiles
    hull:
      - { at: [0, 0],  bays: [core, sensor, comms] }
      - { at: [1, 0],  bays: [engine, engine, coupling], mounts: [laser, shield] }
      - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [laser, shield] }
      - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [armour] }
      - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
      - { at: [-1, 1], bays: [engine, coupling, stealth], mounts: [armour] }
      - { at: [0, 1],  bays: [engine, coupling, stealth] }
  missile_flagship:            # 7 segments, three launchers, one laser; `missiles` in the fleet sets its load (up to 15)
    load: { missile: 9 }
    hull:
      - { at: [0, 0],  bays: [core, magazine, magazine] }
      - { at: [1, 0],  bays: [engine, magazine, coupling], mounts: [launcher, shield] }
      - { at: [1, -1], bays: [engine, sensor, coupling],   mounts: [launcher, point_defence] }
      - { at: [0, -1], bays: [engine, magazine, coupling], mounts: [armour, laser] }
      - { at: [-1, 0], bays: [engine, magazine, coupling], mounts: [launcher] }
      - { at: [-1, 1], bays: [engine, engine, coupling],   mounts: [armour] }
      - { at: [0, 1],  bays: [engine, engine, coupling] }
  small_flagship:              # 4 segments: two lasers, a launcher with 3 missiles, point defence
    load: { missile: 3 }
    hull:
      - { at: [0, 0],  bays: [core, magazine, sensor] }
      - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
      - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
      - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }

  # ---- added for the variety study (tools/variants.mjs) ----
  cruiser:                     # 3 segments, two lasers, a launcher with 2 missiles, a shield, point defence: the identical ship for personality teams
    load: { missile: 2 }
    hull:
      - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
      - { at: [0, 0],  bays: [core, sensor, magazine],   mounts: [launcher, armour] }
      - { at: [1, 0],  bays: [engine, engine, coupling], mounts: [laser, point_defence] }
  dreadnought:                 # one big flagship: 7 segments, four lasers, six shields, two launchers, 12 engines
    load: { missile: 3 }
    hull:
      - { at: [0, 0],  bays: [core, sensor, magazine] }
      - { at: [1, 0],  bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
      - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, shield, point_defence] }
      - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, armour, shield] }
      - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
      - { at: [-1, 1], bays: [engine, engine, coupling], mounts: [laser, shield, point_defence] }
      - { at: [0, 1],  bays: [engine, engine, coupling], mounts: [launcher, armour, shield] }
  shieldboat:                  # a gunboat with a shield and armour on both segments
    hull:
      - { at: [0, 0], bays: [core, engine, sensor],     mounts: [laser, shield, armour] }
      - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, shield, armour] }
  bastion:                     # 4-segment flagship, shield and armour on every segment, three lasers
    hull:
      - { at: [0, 0],  bays: [core, sensor, comms],      mounts: [shield, armour, point_defence] }
      - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
      - { at: [0, -1], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
      - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
  skiff:                       # the cheapest thing with a gun: one segment, one laser
    hull:
      - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }
  shadow:                      # stealth flagship: 4 segments, a stealth part in every one, three lasers
    hull:
      - { at: [0, 0],  bays: [core, sensor, stealth] }
      - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [laser, shield] }
      - { at: [0, -1], bays: [engine, coupling, stealth], mounts: [laser, armour] }
      - { at: [1, -1], bays: [engine, coupling, stealth], mounts: [laser, point_defence] }
  seeker:                      # sees 6 hexes: two sensors, two lasers, point defence
    hull:
      - { at: [0, 0], bays: [core, sensor, sensor],     mounts: [laser] }
      - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, point_defence] }
  pd_escort:                   # anti-missile escort: point defence and a shield on both segments
    hull:
      - { at: [0, 0], bays: [core, engine, sensor],     mounts: [laser, point_defence, shield] }
      - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, point_defence, shield] }

  # ---- new kinds of ship (see docs/design/ships-and-boards.md) ----
  dart:                        # a courier: 5 hexes a turn on its own drive, sees 4 hexes, no weapons, dies to one close shot
    hull:
      - { at: [0, 0], bays: [core, sprint_drive, sensor] }
  king:                        # a command ship with no weapons at all: armour, shields, point defence, and it must be guarded
    hull:
      - { at: [-1, 0], bays: [engine, coupling, stealth], mounts: [armour, shield] }
      - { at: [0, 0],  bays: [core, comms, sensor],       mounts: [point_defence, armour] }
      - { at: [1, 0],  bays: [engine, coupling, stealth], mounts: [armour, shield] }

  command_corvette:            # the small flagship with its core behind armour and a shield (one lucky shot no longer kills it)
    load: { missile: 3 }
    hull:
      - { at: [0, 0],  bays: [core, magazine, sensor],   mounts: [armour, shield] }
      - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield] }
      - { at: [0, -1], bays: [engine, engine, coupling], mounts: [launcher, point_defence] }
      - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, armour] }

# A fleet is a list of ships. The first one marked `flag` is the flagship (lose it and you lose).
# `ai:` gives one ship its own personality; `missiles:` overrides how many it carries.
fleets:
  stock:        [ { ship: flagship, flag: true }, { ship: scout } ]
  guns3:        [ { ship: brawler, flag: true }, { ship: gunboat }, { ship: gunboat } ]
  missiles3:    [ { ship: missile_flagship, flag: true }, { ship: missile_boat }, { ship: missile_boat } ]
  snipers3:     [ { ship: flagship, flag: true }, { ship: sniper }, { ship: sniper } ]
  decoys5:      [ { ship: flagship, flag: true }, { ship: scout }, { ship: decoy }, { ship: decoy }, { ship: decoy } ]
  mixed3:       [ { ship: flagship, flag: true, ai: defensive }, { ship: gunboat, ai: aggressive }, { ship: missile_boat, ai: balanced } ]
  swarm5:       [ { ship: small_flagship, flag: true }, { ship: gunboat }, { ship: gunboat }, { ship: missile_boat }, { ship: picket } ]
  missile5:     [ { ship: small_flagship, flag: true }, { ship: missile_boat }, { ship: missile_boat }, { ship: missile_boat }, { ship: missile_boat } ]
  # ---- added for the variety study. COSTFILL ----
  solo:         [ { ship: dreadnought, flag: true } ]
  pair_guns:    [ { ship: small_flagship, flag: true }, { ship: gunboat } ]
  shields3:     [ { ship: bastion, flag: true }, { ship: shieldboat }, { ship: shieldboat } ]
  guns4:        [ { ship: brawler, flag: true }, { ship: gunboat }, { ship: gunboat }, { ship: gunboat } ]
  mixed4:       [ { ship: small_flagship, flag: true }, { ship: gunboat }, { ship: missile_boat }, { ship: sniper } ]
  stealth4:     [ { ship: shadow, flag: true }, { ship: sniper }, { ship: sniper }, { ship: scout } ]
  cheap5:       [ { ship: small_flagship, flag: true }, { ship: skiff }, { ship: skiff }, { ship: skiff }, { ship: skiff } ]
  guns5:        [ { ship: brawler, flag: true }, { ship: gunboat }, { ship: gunboat }, { ship: skiff }, { ship: skiff } ]
  mixed5:       [ { ship: flagship, flag: true }, { ship: gunboat }, { ship: missile_boat }, { ship: sniper }, { ship: picket } ]
  # identical ships, for the personality team tests (the pilot mix is set in the cell, see ai_variants.yaml)
  team3:        [ { ship: cruiser, flag: true }, { ship: cruiser }, { ship: cruiser } ]
  team4:        [ { ship: cruiser, flag: true }, { ship: cruiser }, { ship: cruiser }, { ship: cruiser } ]
  team5:        [ { ship: cruiser, flag: true }, { ship: cruiser }, { ship: cruiser }, { ship: cruiser }, { ship: cruiser } ]
  # fleets built to counter others (see `counters:` below)
  anti_missile3: [ { ship: bastion, flag: true }, { ship: pd_escort }, { ship: pd_escort } ]
  anti_stealth3: [ { ship: small_flagship, flag: true }, { ship: seeker }, { ship: seeker } ]
  standoff3:     [ { ship: missile_flagship, flag: true }, { ship: sniper }, { ship: sniper } ]
  heavy2:        [ { ship: dreadnought, flag: true }, { ship: gunboat } ]
  wolfpack4:     [ { ship: small_flagship, flag: true }, { ship: missile_boat }, { ship: missile_boat }, { ship: missile_boat } ]

# Which fleets each counter fleet was built to beat (a design guess, tested in the "counters" suite).
counters:
  anti_missile3: [missiles3, missile5, wolfpack4]     # point defence and shields everywhere
  anti_stealth3: [snipers3, stealth4, decoys5]        # sensors to find them
  standoff3:     [guns3, guns4, shields3]             # out-range the guns
  heavy2:        [swarm5, cheap5, guns5]              # one hull too tough for small guns
  wolfpack4:     [solo, stock, heavy2]                # many missiles at one big target


# Tactics for tools/counter.mjs: ways to fly a fleet. A name on its own is a personality from the
# world file (or camp: stay home and shuffle a hex before each shot); a block is a personality
# written out here. The tool flies the weaker fleet each way against an opponent that just fights
# head-on, to find the trick that turns a losing match-up.
tactics:
  head_on: balanced
  aggressive: aggressive
  defensive: defensive
  camp: camp
  spread_out:    { range: [3, 4], keep_together: 0, missile_range: 5 }
  max_range:     { range: [8, 8], keep_together: 3, missile_range: 12 }
  long_missiles: { range: [5, 6], keep_together: 2, missile_range: 12 }
  blind_fire:    { range: [5, 6], keep_together: 2, missile_range: 12, blind_fire: true, blind_fire_at_home: true, blind_fire_keeps: 0 }
  bait:          { range: [3, 4], keep_together: 3, missile_range: 5, unarmed_ships: bait, bait_lead: 3 }
