</defs><polygon points="0,0 0,-40 34.64,-60 34.64,-20" fill="#2fe0b0" fill-opacity=".1"/><polygon points="0,0 34.64,-20 69.28,0 34.64,20" fill="#2fe0b0" fill-opacity=".1"/><polygon points="0,0 34.64,20 34.64,60 0,40" fill="#2fe0b0" fill-opacity=".1"/><polygon points="0,0 0,40 -34.64,60 -34.64,20" fill="#2fe0b0" fill-opacity=".1"/><polygon points="0,0 -34.64,20 -69.28,0 -34.64,-20" fill="#2fe0b0" fill-opacity=".1"/><polygon points="0,0 -34.64,-20 -34.64,-60 0,-40" fill="#2fe0b0" fill-opacity=".1"/><path d="M0,0L0,-40L34.64,-60L34.64,-20ZM0,0L34.64,-20L69.28,0L34.64,20ZM0,0L34.64,20L34.64,60L0,40ZM0,0L0,40L-34.64,60L-34.64,20ZM0,0L-34.64,20L-69.28,0L-34.64,-20ZM0,0L-34.64,-20L-34.64,-60L0,-40Z" fill="none" stroke="url(#ss)" stroke-width="3.2" stroke-linejoin="round" filter="url(#sglow)"/><circle r="7" fill="url(#sn)"/>
