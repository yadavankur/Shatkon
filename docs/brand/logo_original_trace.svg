<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115 -115 230 230"><title>SHATKON mark: faithful trace of the original logo (flaw included)</title>
<!-- Traced from brand/src/logo_original.jpg. Faithful, including the flaw: the two lines from the bottom inner node run on to the outer edge and cut two small triangles. The original's slight vertical stretch is normalised to a regular hexagon. -->
<defs>
  <linearGradient id="ts" x1="-80" y1="-100" x2="80" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cfe8ff"/><stop offset=".5" stop-color="#7fd8f0"/><stop offset="1" stop-color="#2fe0b0"/></linearGradient>
  <radialGradient id="tn"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#5ff7ff"/><stop offset="1" stop-color="#5ff7ff" stop-opacity="0"/></radialGradient>
  <filter id="tglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
