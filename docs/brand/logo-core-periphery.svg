<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115 -125 230 250"><title>SHATKON mark: core and periphery</title>
<!-- Core & periphery: the designer's reading of the logo. Three core hexagons meet at the centre (they host the bays); three tip rhombi form the periphery (they host the mounts). -->
<rect x="-115" y="-125" width="230" height="250" fill="#040812"/>
<polygon points="51.96,-70 86.6,-50 86.6,-10 34.64,20 0,0 0,-40" fill="#19c3b3" fill-opacity="0.34" stroke="none"/>
<polygon points="34.64,80 0,100 -34.64,80 -34.64,20 0,0 34.64,20" fill="#2f9fd8" fill-opacity="0.34" stroke="none"/>
<polygon points="-86.6,-10 -86.6,-50 -51.96,-70 0,-40 0,0 -34.64,20" fill="#4a8cff" fill-opacity="0.34" stroke="none"/>
<polygon points="0,-100 51.96,-70 0,-40 -51.96,-70" fill="#cfe8ff" fill-opacity="0.22" stroke="none"/>
<polygon points="86.6,50 34.64,80 34.64,20 86.6,-10" fill="#cfe8ff" fill-opacity="0.22" stroke="none"/>
<polygon points="-86.6,50 -86.6,-10 -34.64,20 -34.64,80" fill="#cfe8ff" fill-opacity="0.22" stroke="none"/>
<defs>
  <linearGradient id="os" x1="-80" y1="-100" x2="80" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cfe8ff"/><stop offset=".5" stop-color="#7fd8f0"/><stop offset="1" stop-color="#2fe0b0"/></linearGradient>
  <radialGradient id="on"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#5ff7ff"/><stop offset="1" stop-color="#5ff7ff" stop-opacity="0"/></radialGradient>
  <filter id="oglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 -100L86.6 -50M86.6 -50L86.6 50M86.6 50L0 100M0 100L-86.6 50M-86.6 50L-86.6 -50M-86.6 -50L0 -100M0 -40L51.96 -70M0 -40L-51.96 -70M34.64 20L34.64 80M34.64 20L86.6 -10M-34.64 20L-86.6 -10M-34.64 20L-34.64 80M0 -40L0 40M34.64 -20L-34.64 20M34.64 20L-34.64 -20M34.64 -60L34.64 -20M34.64 -20L69.28 0M34.64 60L0 40M0 40L-34.64 60M-69.28 0L-34.64 -20M-34.64 -20L-34.64 -60" fill="none" stroke="url(#os)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#oglow)"/>
<circle cx="0" cy="0" r="9" fill="url(#on)"/>
<text x="43.3" y="-22.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8.5" fill="#dcecff" text-anchor="middle">core</text>
<text x="0.0" y="53.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8.5" fill="#dcecff" text-anchor="middle">core</text>
<text x="-43.3" y="-22.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8.5" fill="#dcecff" text-anchor="middle">core</text>
<text x="0.0" y="-67.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8.5" fill="#dcecff" text-anchor="middle">periphery</text>
<text x="60.6" y="38.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8.5" fill="#dcecff" text-anchor="middle">periphery</text>
