<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shatkon: The Weave · story demo</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#070b16;--panel:#101830;--line:#25325a;--text:#e7ecf6;--muted:#8f9cba;--gold:#e8c15a;--blue:#5cc8ff;--red:#ff5a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:17px;letter-spacing:.05em}
h1 span{color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:10px 16px 60px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 12px;min-height:40px;cursor:pointer;font:inherit}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl label{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;min-height:48px;text-align:left;cursor:pointer;font:inherit}
.item:hover,.item:focus-visible{border-color:var(--gold);outline:none}
.item code{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--blue)}
.item small{display:block;color:var(--muted);font-size:11.5px}
.item.bark code{color:var(--red)}
#log{font:12.5px ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;margin-top:10px}
#stagewrap{position:fixed;inset:0;z-index:100;display:none;background:#000}
#stagewrap.on{display:block}
#battle{position:fixed;inset:0;pointer-events:none;z-index:120}
.go{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<header>
  <h1>SHATKON · <span>The Weave</span> · story demo</h1>
  <div class="ctl">
    <label id="caplab">Captain</label>
    <div class="seg" role="group" aria-labelledby="caplab" id="capseg">
      <button type="button" data-v="captain_a" aria-pressed="true">captain_a</button>
      <button type="button" data-v="captain_b" aria-pressed="false">captain_b</button>
    </div>
    <label id="spdlab">Text</label>
    <div class="seg" role="group" aria-labelledby="spdlab" id="spdseg">
      <button type="button" data-v="slow" aria-pressed="false">slow</button>
      <button type="button" data-v="normal" aria-pressed="true">normal</button>
      <button type="button" data-v="instant" aria-pressed="false">instant</button>
    </div>
  </div>
</header>
<main>
  <div id="lists"><p class="muted">Loading story…</p></div>
  <h2>Last result</h2>
  <div id="log" aria-live="polite">Tap a scene to play it. Tap, click, Space or Enter advances; Skip ends it.</div>
</main>
<div id="stagewrap"></div>
<div id="battle"></div>
<script type="module">
import { loadStory, playScene, preloadScenes } from './player.js';
import { showBark } from './bark.js';

const $ = (s) => document.querySelector(s);
const opts = { captain: 'captain_a', textSpeed: 'normal' };
for (const [segId, key] of [['#capseg', 'captain'], ['#spdseg', 'textSpeed']]) {
  $(segId).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    opts[key] = b.dataset.v;
    for (const x of $(segId).querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
  });
}
const log = (t) => { $('#log').textContent = t; };
const base = new URL('./', import.meta.url).href; // works from any static host path
await loadStory(base);
const index = await (await fetch(new URL('scenes/index.json', base))).json();
const barks = await (await fetch(new URL('barks.json', base))).json();

const chapters = new Map();
for (const id of index.scenes) {
  const ch = id.match(/^ch(\d)/)?.[1] || '?';
  if (!chapters.has(ch)) chapters.set(ch, []);
  chapters.get(ch).push(id);
}
const titles = { 1: 'Chapter 1 · First Contact', 2: 'Chapter 2 · Quiet Water', 3: 'Chapter 3 · The Splitting', 4: 'Chapter 4 · The Fork / Ashfall', 5: 'Chapter 5 · The Bloom' };
const lists = $('#lists'); lists.innerHTML = '';
for (const [ch, ids] of chapters) {
  const h = document.createElement('h2'); h.textContent = titles[ch] || `Chapter ${ch}`; lists.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid'; lists.appendChild(g);
  for (const id of ids) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'item'; b.dataset.scene = id;
    b.innerHTML = `<code>${id}</code>`; g.appendChild(b);
  }
}
const hb = document.createElement('h2'); hb.textContent = `Battle barks (${Object.keys(barks).length})`; lists.appendChild(hb);
const gb = document.createElement('div'); gb.className = 'grid'; lists.appendChild(gb);
for (const [id, b] of Object.entries(barks)) {
  const el = document.createElement('button'); el.type = 'button'; el.className = 'item bark'; el.dataset.bark = id;
  el.innerHTML = `<code>${id}</code><small>${b.speaker}</small>`; gb.appendChild(el);
}
const all = document.createElement('button'); all.className = 'go'; all.type = 'button'; all.textContent = 'Fire all barks'; all.style.marginTop = '10px';
all.addEventListener('click', () => { for (const id of Object.keys(barks)) showBark(id, $('#battle'), opts); });
lists.appendChild(all);

let playing = false;
export async function play(id, o = opts) {
  if (playing) return null;
  playing = true;
  const wrap = $('#stagewrap'); wrap.classList.add('on');
  try {
    const r = await playScene(id, wrap, { ...o, skippable: true, onLine: (ln) => { window.__lastLine = ln; } });
    log(`${id} → ${JSON.stringify(r)}`);
    return r;
  } catch (e) { log(`${id} failed: ${e.message}`); console.error(e); return null; }
  finally { wrap.classList.remove('on'); playing = false; }
}
lists.addEventListener('click', (e) => {
  const s = e.target.closest('[data-scene]'); if (s) { play(s.dataset.scene); return; }
  const b = e.target.closest('[data-bark]'); if (b) showBark(b.dataset.bark, $('#battle'), opts);
});
preloadScenes(index.scenes.slice(0, 3)).catch(console.error);
window.skDemo = { play, showBark: (id) => showBark(id, $('#battle'), opts), opts, index, barks };
</script>
</body>
</html>
