# RAPID GROK: the board, the fleets and the clock for rapid mode (rapid-grok.html).
#
# Plain English:
# - You and the computer take turns, ONE action each. Your action + its action = one "beat".
# - You get 15 seconds to act, then 5 seconds to watch what the enemy did (only what you can see).
# - At the end of every beat: missiles fly 6 hexes, shields that were not hit come back,
#   point defence reloads (it stops 1 missile a beat), and flares, scans and afterburners tick down.
# - Moving: any ship with a working engine steps 1 hex per move action.
# - No command points, no thrust banking, no attack-run bonus, no "scan only after moving", no undo.
#   Salvo stays: one launch order fires every ready launcher on that ship.
# - No passing. If your clock runs out (see "timeout" below) something still happens.
# - Lose the Flower (the 7-hex flagship) and you lose.
#
# This file is only read by rapid-grok.html and its tests. It is NOT in rules/index.yaml,
# so classic games never see it. Parts come from rules/world_v0.4.yaml, the same as classic.

rapid_grok:
  act_seconds: 15        # your thinking time each turn (the shrinking bar)
  watch_seconds: 5       # how long you get to see what the enemy just did
  cancel_seconds: 1.5    # the red "cancel" window when the clock auto-fires for you
  beat_limit: 150        # after this many beats the game is a draw (about 50 minutes)
  timeout: |
    Laser or missile selected: it fires at the best target the computer would pick, after a
    1.5 second red Cancel button. Cancel it, or have no target, and that ship steps 1 hex instead.
    Scan selected: scans never run by themselves; that ship steps 1 hex instead.
    Nothing selected: a random ship from your screen (a Skiff) or your front-most ship steps 1 hex.

map:
  name: Rapid 12
  board: { shape: hexagon, radius: 12 }
  # home zones: where each side starts. The computer uses them to know which way is forward,
  # and scans use them (a scan is stronger the further it is from home, same as classic).
  zones:
    player_1_home: { edge: north_east, depth: 10 }
    player_2_home: { edge: south_west, depth: 10 }
    no_mans_land: { everything_else: true }
  terrain:
    - { type: nebula, at: [0, 0], radius: 1 }
    - { type: nebula, at: [-4, 2], radius: 1 }
    - { type: nebula, at: [4, -2], radius: 1 }
    - { type: asteroid, at: [-3, -2], size: 1 }
    - { type: asteroid, at: [3, 2], size: 1 }
    - { type: asteroid, at: [-1, 4], size: 1 }
    - { type: asteroid, at: [1, -4], size: 1 }

# The fleet (same as the fleet sheet mock-up): 9 Skiffs (1 hex), 2 Darts (2 hexes),
# 1 Arrow (3-hex triangle), 1 Lance (4-hex diamond), 1 Flower (7 hexes, flagship).
# Player 2 (the enemy) is an exact mirror of player 1.
fleets:
  budget: 99999
  player_1:
    ships:
      - name: Dart N
        hull:
          - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
          - { at: [0, 1], bays: [coupling, engine, stealth], mounts: [laser, armour] }
      - name: Arrow
        load: { missile_advanced: 3 }
        hull:
          - { at: [0, 0], bays: [core, magazine, sensor], mounts: [laser, shield] }
          - { at: [1, 0], bays: [coupling, engine, stealth], mounts: [launcher, point_defence] }
          - { at: [0, 1], bays: [coupling, engine, stealth], mounts: [laser, armour] }
      - name: Flower
        flagship: true
        load: { missile: 3 }
        hull:
          - { at: [0, 0], bays: [core, magazine, comms], mounts: [armour] }
          - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, shield] }
          - { at: [1, -1], bays: [coupling, engine, sensor], mounts: [launcher, point_defence] }
          - { at: [0, -1], bays: [coupling, engine, stealth], mounts: [armour] }
          - { at: [-1, 0], bays: [coupling, engine, stealth], mounts: [laser] }
          - { at: [-1, 1], bays: [coupling, engine, stealth], mounts: [armour, shield] }
          - { at: [0, 1], bays: [coupling, engine, stealth], mounts: [laser] }
      - name: Lance
        load: { missile: 3 }
        hull:
          - { at: [0, 0], bays: [core, magazine, comms], mounts: [armour, shield] }
          - { at: [0, -1], bays: [coupling, engine, sensor], mounts: [laser, point_defence] }
          - { at: [1, -1], bays: [coupling, engine, stealth], mounts: [launcher, shield] }
          - { at: [-1, 0], bays: [coupling, engine, stealth], mounts: [laser, armour] }
      - name: Dart S
        hull:
          - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
          - { at: [1, -1], bays: [coupling, engine, stealth], mounts: [laser, armour] }
      - { name: Skiff 1, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 2, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 3, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 4, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 5, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 6, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 7, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 8, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
      - { name: Skiff 9, hull: [{ at: [0, 0], bays: [core, engine, sensor], mounts: [laser] }] }
    deployment:
      - { ship: Dart N, at: [12, -9] }
      - { ship: Arrow, at: [11, -5] }
      - { ship: Flower, at: [10, 0] }
      - { ship: Lance, at: [7, 4] }
      - { ship: Dart S, at: [3, 9] }
      - { ship: Skiff 1, at: [10, -6] }
      - { ship: Skiff 2, at: [10, -4] }
      - { ship: Skiff 3, at: [9, -2] }
      - { ship: Skiff 4, at: [8, -1] }
      - { ship: Skiff 5, at: [8, 0] }
      - { ship: Skiff 6, at: [7, 1] }
      - { ship: Skiff 7, at: [6, 2] }
      - { ship: Skiff 8, at: [5, 4] }
      - { ship: Skiff 9, at: [3, 6] }
  player_2: { copy_of: player_1, mirror_ships: true, mirror_deployment: true }
