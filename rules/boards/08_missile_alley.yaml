# ============================================================
#  BOARD: Missile Alley
#
#  A long, straight, five-hex-wide alley between walls of rock, thirteen rows deep. You have 18
#  missiles and one laser. They have point defence and a shield on every ship, and they are coming
#  down the alley at you.
#
#  Try: Each point defence stops one missile a round (the escorts carry two each), and a shield
#  takes one blow. A ship fires all its launchers on one order: put three or more missiles on one
#  target in the same round and the rest land. In the alley they cannot spread out, so the blast (1
#  hit to everything next to the target) hurts the ship beside it too.
#
#  You are player_1 (south end). The computer is player_2. The computer comes from the north end.
#  Open it at  play.html?board=08_missile_alley   Edit anything here and reload.
#
#  Design notes (maps-rework): was open space; now a corridor (the walls are written as discs).
#  Nowhere to dodge, nowhere to flank: a test of missile timing against point defence.
#  Retune (maps, 2026-11-16, after the computer stopped replaying one game: 3 of 40): the missile
#  boats trade an engine for a second sensor so they can see a target before its lasers reach
#  them, and the escorts' second laser became armour (they still carry two point defences).
#  Thrust per ship (maps, 18 Nov 2026): the boats got their second engine back in place of the
#  second sensor. On one engine a 2-hex boat moved a hex every other turn and the missile side
#  won 4 of 80 computer games (20 of 80 before the rule change); with two it is 16 of 80.
# ============================================================

board:
  name: "Missile Alley"
  idea: "A long, straight, five-hex-wide alley between walls of rock, thirteen rows deep. You have 18 missiles and one laser. They have point defence and a shield on every ship, and they are coming down the alley at you."
  try: "Each point defence stops one missile a round (the escorts carry two each), and a shield takes one blow. A ship fires all its launchers on one order: put three or more missiles on one target in the same round and the rest land. In the alley they cannot spread out, so the blast (1 hit to everything next to the target) hurts the ship beside it too."
  rules:                      # world-file numbers this board changes (path: value); empty = the standard rules
    ai.vs_computer: "aggressive"

budget: 99999                 # boards are not held to the fleet budget

map:
  name: "Missile Alley"
  board: { shape: hexagon, radius: 10 }
  zones:
    player_1_home: { edge: south, depth: 3 }
    player_2_home: { edge: north, depth: 3 }
    no_mans_land:  { everything_else: true }
  setup:
    mines: { own_home_zone: true, rows_into_no_mans_land: 3 }
  terrain:
    - { type: asteroid, at: [-7, 0], radius: 3 }
    - { type: asteroid, at: [5, 2], radius: 3 }
    - { type: asteroid, at: [7, -2], radius: 3 }
    - { type: asteroid, at: [-7, 4], radius: 2 }
    - { type: asteroid, at: [-3, -4], radius: 2 }
    - { type: asteroid, at: [9, 0], size: 7 }
    - { type: asteroid, at: [-10, 4], size: 1 }
    - { type: asteroid, at: [-10, 5], size: 1 }
    - { type: asteroid, at: [-10, 6], size: 1 }
    - { type: asteroid, at: [-6, -4], size: 1 }
    - { type: asteroid, at: [-6, 6], size: 1 }
    - { type: asteroid, at: [-5, -5], size: 1 }
    - { type: asteroid, at: [-4, -6], size: 1 }
    - { type: asteroid, at: [-4, 1], size: 1 }
    - { type: asteroid, at: [-4, 2], size: 1 }
    - { type: asteroid, at: [-3, -1], size: 1 }
    - { type: asteroid, at: [-3, 0], size: 1 }
    - { type: asteroid, at: [-2, -2], size: 1 }
    - { type: asteroid, at: [0, -6], size: 1 }
    - { type: asteroid, at: [0, 6], size: 1 }
    - { type: asteroid, at: [1, 4], size: 1 }
    - { type: asteroid, at: [1, 5], size: 1 }
    - { type: asteroid, at: [1, 6], size: 1 }
    - { type: asteroid, at: [2, 6], size: 1 }
    - { type: asteroid, at: [3, 0], size: 1 }
    - { type: asteroid, at: [3, 6], size: 1 }
    - { type: asteroid, at: [4, 6], size: 1 }
    - { type: asteroid, at: [5, -4], size: 1 }
    - { type: asteroid, at: [6, -6], size: 1 }
    - { type: asteroid, at: [6, -5], size: 1 }
    - { type: asteroid, at: [7, -6], size: 1 }
    - { type: asteroid, at: [8, -6], size: 1 }
    - { type: asteroid, at: [9, -6], size: 1 }
    - { type: asteroid, at: [10, -6], size: 1 }

player_1:
  ships:
    - name: "Arsenal"                # missile flagship
      flagship: true
      load: { missile: 9 }
      hull:
        - { at: [0, 0], bays: [core, magazine, magazine] }
        - { at: [1, 0], bays: [engine, magazine, coupling], mounts: [launcher, shield] }
        - { at: [1, -1], bays: [engine, sensor, coupling], mounts: [launcher, point_defence] }
        - { at: [0, -1], bays: [engine, magazine, coupling], mounts: [armour, laser] }
        - { at: [-1, 0], bays: [engine, magazine, coupling], mounts: [launcher] }
        - { at: [-1, 1], bays: [engine, engine, coupling], mounts: [armour] }
        - { at: [0, 1], bays: [engine, engine, coupling] }
    - name: "Quiver"                # missile boat
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, engine, magazine], mounts: [launcher] }
        - { at: [1, 0], bays: [coupling, engine, sensor], mounts: [launcher, armour] }
    - name: "Sling"                # missile boat
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, engine, magazine], mounts: [launcher] }
        - { at: [1, 0], bays: [coupling, engine, sensor], mounts: [launcher, armour] }
    - name: "Sheaf"                # missile boat
      load: { missile: 3 }
      hull:
        - { at: [0, 0], bays: [core, engine, magazine], mounts: [launcher] }
        - { at: [1, 0], bays: [coupling, engine, sensor], mounts: [launcher, armour] }
  deployment:
    - { ship: "Arsenal", at: [-4, 9] }
    - { ship: "Quiver", at: [-9, 9] }
    - { ship: "Sling", at: [0, 9] }
    - { ship: "Sheaf", at: [-7, 10] }

player_2:
  ships:
    - name: "Aegis"                # bastion
      flagship: true
      hull:
        - { at: [0, 0], bays: [core, sensor, comms], mounts: [shield, armour, point_defence] }
        - { at: [-1, 0], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
        - { at: [0, -1], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
        - { at: [1, -1], bays: [engine, engine, coupling], mounts: [laser, shield, armour] }
    - name: "Buckler"                # point-defence escort
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, point_defence, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [armour, point_defence, shield] }
    - name: "Targe"                # point-defence escort
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, point_defence, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [armour, point_defence, shield] }
    - name: "Pike"                # gunboat
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield] }
        - { at: [1, 0], bays: [coupling, engine, engine], mounts: [laser, armour] }
  deployment:
    - { ship: "Aegis", at: [4, -9] }
    - { ship: "Buckler", at: [7, -9] }
    - { ship: "Targe", at: [0, -9] }
    - { ship: "Pike", at: [7, -10] }
