# ============================================================
#  BOARD: Lab (the Experiments page; built by Claude Opus, 24 Nov 2026)
#
#  A small board for trying the experiments (engine/experiments.js) without playing a whole game:
#  Frontier's rules (rekon economy, intercepted missiles stun) on a radius-7 board with small fleets.
#  Each side: a Warden (flagship), a Lancer, a Mirage (a 2-hex ship with a decoy emitter) and
#  three scouts. The experiments themselves are switched on from the Experiments page.
#
#  The maps/story bot is welcome to add practice set-ups next to this one (rules/rapid/lab_*.yaml):
#  see handoff/to-maps.md.
#  Open it at  play.html?board=rapid_lab
# ============================================================

board:
  name: "Lab"
  idea: "Small fleets on a small board, for trying the experiments switched on from the Experiments page."
  try: "Turn on one or two experiments, play a few ticks, see what they do. You don't have to finish."
  rules: {}

rapid:
  line: 7                     # halfway on this radius-7 board
  economy: on
  interceptHurts: on
  experiments: on             # the play page shows the experiment switches for this board
  econ: { newHex: 1, asteroid: 1, cross: 3, hold: 1, kill: 2 }

budget: 99999

map:
  name: "Lab"
  board: { shape: hexagon, radius: 7 }
  zones:
    player_1_home: { edge: south, depth: 4 }
    player_2_home: { edge: north, depth: 4 }
    no_mans_land:  { everything_else: true }
  terrain:
    - { type: asteroid, at: [0, 0], size: 1 }
    - { type: asteroid, at: [-3, 2], size: 1 }
    - { type: asteroid, at: [3, -2], size: 1 }
    - { type: asteroid, at: [4, 1], size: 1 }
    - { type: asteroid, at: [-4, -1], size: 1 }

player_1:
  ships:
    - name: "Warden"               # 3-hex, flagship
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [laser, shield, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, stealth],  mounts: [laser, shield, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Lancer"               # 2-hex missile boat
      load: { missile_basic: 2, missile: 1 }
      hull:
        - { at: [0, 0],   bays: [core, engine, sensor],       mounts: [laser, shield, armour] }
        - { at: [1, 0],   bays: [coupling, magazine, engine], mounts: [launcher, laser, armour] }
    - name: "Mirage"               # 2-hex decoy maker: the emitter makes decoys (experiment) and draws missiles
      hull:
        - { at: [0, 0],   bays: [core, engine, sensor],       mounts: [laser, shield, armour] }
        - { at: [1, 0],   bays: [coupling, emitter, engine],  mounts: [laser, shield, armour] }
    - name: "Pawn A"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
    - name: "Pawn B"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
    - name: "Pawn C"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
  deployment:
    - { ship: "Warden", at: [0, 7] }
    - { ship: "Lancer", at: [2, 4] }
    - { ship: "Mirage", at: [-5, 7] }
    - { ship: "Pawn A", at: [-2, 4] }
    - { ship: "Pawn B", at: [-1, 5] }
    - { ship: "Pawn C", at: [-4, 5] }

player_2:
  copy_of: player_1
  mirror_ships: true
  mirror_deployment: true
