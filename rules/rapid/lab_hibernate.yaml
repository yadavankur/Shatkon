# ============================================================
#  BOARD: Hibernate (Experiments practice set-up)
#
#  Same format as rules/rapid/rapid_lab.yaml (the Experiments Lab board).
#  Open it at  play.html?board=lab_hibernate
#
#  What to try: Buy → Hibernate on the scout that is already next to the rock
#  (◈2; you start with it). If you move that scout
#  instead, tap Stay a ship.
#  What to look for: The scout shuts down. The enemy sees it only from 1 hex or
#  by a scan. If it was hurt, one part comes back every 4 ticks. Any action, or
#  an enemy within 1 hex, wakes it. Against the computer they will hibernate a
#  hurt scout by a rock when they can pay.
#
#  A Warden and two scouts a side, within Ankur's limit of two scouts and one
#  3-section ship at most. Your front scout starts next to an asteroid, just
#  past the line. Home zones stay in each side's own half (depth 7). The
#  Hibernate switch is on; the computer will hibernate when it can; the others
#  stay off.
# ============================================================

board:
  name: "Hibernate"
  idea: "The scout shuts down. The enemy sees it only from 1 hex or by a scan. If it was hurt, one part comes back every 4 ticks. Any action, or an enemy within 1 hex, wakes it. Against the computer they will hibernate a hurt scout by a rock when they can pay."
  try: "Buy → Hibernate on the scout that is already next to the rock (◈2; you start with it). If you move that scout instead, tap Stay a ship."
  rules: {}

rapid:
  line: 4                     # your front scout starts just past it (the Experiments sheet still overrides it)
  economy: on
  interceptHurts: on
  experiments: on
  exp: { hibernate: true }    # only Hibernate is on
  cpuExp: { hibernate: sometimes }
  startRekon: 2               # both sides start with ◈2: enough to buy it on tick 1
  econ: { newHex: 1, asteroid: 1, cross: 3, hold: 1, kill: 2 }

budget: 99999

map:
  name: "Hibernate"
  board: { shape: hexagon, radius: 7 }
  zones:
    player_1_home: { edge: south, depth: 7 }
    player_2_home: { edge: north, depth: 7 }
    no_mans_land:  { everything_else: true }
  terrain:
    - { type: asteroid, at: [0, 2], size: 1 }    # the rock your front scout starts next to
    - { type: asteroid, at: [5, 0], size: 1 }
    - { type: asteroid, at: [-5, 0], size: 1 }
    - { type: asteroid, at: [5, -3], size: 1 }

player_1:
  ships:
    - name: "Warden"
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [laser, shield, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, emitter],  mounts: [laser, shield, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Pawn A"               # already next to the rock at [0, 2]
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
    - name: "Pawn B"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
  deployment:
    - { ship: "Warden", at: [-4, 5] }
    - { ship: "Pawn A", at: [0, 3] }
    - { ship: "Pawn B", at: [3, 3] }

player_2:
  ships:
    - name: "Warden"
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [laser, shield, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, emitter],  mounts: [laser, shield, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Pawn A"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
    - name: "Pawn B"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
  deployment:
    - { ship: "Warden", at: [4, -5] }    # kept away: an enemy within 1 would wake a hibernating scout
    - { ship: "Pawn A", at: [3, -4] }
    - { ship: "Pawn B", at: [-3, -4] }
