# ============================================================
#  BOARD: Ghost (Experiments practice set-up)
#
#  Same format as rules/rapid/rapid_lab.yaml (the Experiments Lab board).
#  Open it at  play.html?board=lab_ghost
#
#  What to try: Move your front scout one hex toward the enemy (it starts past
#  the line). On Convert to?, tap Scanner buoy or Mine — not Stay a ship. If you
#  move the other scout, tap Stay a ship.
#  What to look for: The scout is gone, and the enemy sees nothing in its place
#  for 2 ticks, even from the next hex.
#
#  A Warden and two scouts a side, within Ankur's limit of two scouts and one
#  3-section ship at most. Your front scout starts in their sight, just past the
#  line; one hex toward them and it converts beside their scout. Home zones stay
#  in each side's own half (depth 7). The Ghost switch is on; the others stay off.
# ============================================================

board:
  name: "Ghost"
  idea: "The scout is gone, and the enemy sees nothing in its place for 2 ticks, even from the next hex."
  try: "Move your front scout one hex toward the enemy (it starts past the line). On Convert to?, tap Scanner buoy or Mine — not Stay a ship. If you move the other scout, tap Stay a ship."
  rules: {}

rapid:
  line: 6                     # your scouts at r 1 are just past it (the Experiments sheet still overrides it)
  economy: on
  interceptHurts: on
  experiments: on
  exp: { ghost: true }        # only Ghost is on
  econ: { newHex: 1, asteroid: 1, cross: 3, hold: 1, kill: 2 }

budget: 99999

map:
  name: "Ghost"
  board: { shape: hexagon, radius: 7 }
  zones:
    player_1_home: { edge: south, depth: 7 }
    player_2_home: { edge: north, depth: 7 }
    no_mans_land:  { everything_else: true }
  terrain:
    - { type: asteroid, at: [5, 0], size: 1 }
    - { type: asteroid, at: [-5, 0], size: 1 }
    - { type: asteroid, at: [5, -3], size: 1 }
    - { type: asteroid, at: [-5, 3], size: 1 }

player_1:
  ships:
    - name: "Warden"
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [laser, shield, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, emitter],  mounts: [laser, shield, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Pawn A"               # in their sight, just past the line; one hex north and convert
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
    - name: "Pawn B"               # also past the line, so you stay free to pass after Pawn A converts
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
  deployment:
    - { ship: "Warden", at: [-5, 6] }
    - { ship: "Pawn A", at: [0, 1] }
    - { ship: "Pawn B", at: [3, 1] }

player_2:
  ships:
    - name: "Warden"
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [shield, armour, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, stealth],  mounts: [shield, armour, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Pawn A"               # no laser: they watch (and can step next door) instead of shooting
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [shield, armour, armour] }
    - name: "Pawn B"
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [shield, armour, armour] }
  deployment:
    - { ship: "Warden", at: [4, -5] }
    - { ship: "Pawn A", at: [0, -1] }   # next door once your scout converts at [0, 0]
    - { ship: "Pawn B", at: [-3, -4] }
