# ============================================================
#  BOARD: Smart mine (Experiments practice set-up)
#
#  Same format as rules/rapid/rapid_lab.yaml (the Experiments Lab board).
#  Open it at  play.html?board=lab_stateMines
#
#  What to try: Move your healthy scout one hex (it starts past the line). On
#  Convert to?, tap Mine — not Stay a ship. If you move the other scout, tap
#  Stay a ship.
#  What to look for: The scout becomes a smart mine (S). When an enemy scout
#  comes within 3 hexes, the mine goes off and wrecks a section. Against the
#  computer they walk in; if you play both sides, walk one of theirs one hex
#  toward the mine.
#
#  A Warden and two healthy scouts on your side (Pawn A converts; Pawn B stays a
#  ship so you can pass after the conversion); a Warden and two scouts on theirs,
#  already walking in. Within Ankur's limit of two scouts and one 3-section ship
#  at most. The line sits at 6 so your scouts start just past it. Home zones stay
#  in each side's own half (depth 7). A short line of rocks blocks the western
#  walk-around so the computer's scouts come into the mine's 3-hex range. The
#  Mines from the ship's state switch is on; the others stay off.
# ============================================================

board:
  name: "Smart mine"
  idea: "The scout becomes a smart mine (S). When an enemy scout comes within 3 hexes, the mine goes off and wrecks a section. Against the computer they walk in; if you play both sides, walk one of theirs one hex toward the mine."
  try: "Move your healthy scout one hex (it starts past the line). On Convert to?, tap Mine — not Stay a ship. If you move the other scout, tap Stay a ship."
  rules: {}

rapid:
  line: 6                     # your scouts at r 1 are just past it (the Experiments sheet still overrides it)
  economy: on
  interceptHurts: on
  experiments: on             # the play page shows the experiment switches for this board
  exp: { stateMines: true }   # only Mines from the ship's state is on
  econ: { newHex: 1, asteroid: 1, cross: 3, hold: 1, kill: 2 }

budget: 99999

map:
  name: "Smart mine"
  board: { shape: hexagon, radius: 7 }
  zones:
    player_1_home: { edge: south, depth: 7 }
    player_2_home: { edge: north, depth: 7 }
    no_mans_land:  { everything_else: true }
  terrain:
    - { type: asteroid, at: [4, 0], size: 1 }
    - { type: asteroid, at: [-4, 0], size: 1 }
    - { type: asteroid, at: [5, -3], size: 1 }
    - { type: asteroid, at: [-5, 3], size: 1 }
    # block the west-forward track so the computer cannot walk around the mine at 4 hexes
    - { type: asteroid, at: [-1, -3], size: 1 }
    - { type: asteroid, at: [-2, -2], size: 1 }
    - { type: asteroid, at: [-3, -1], size: 1 }

player_1:
  ships:
    - name: "Warden"               # 3-hex, flagship, kept back of the line
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [laser, shield, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, emitter],  mounts: [laser, shield, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Pawn A"               # healthy: laser and sensor working, so it becomes a smart mine
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
    - name: "Pawn B"               # also past the line, so you stay free to pass after Pawn A converts. If you move it, tap Stay a ship.
      hull:
        - { at: [0, 0], bays: [core, engine, sensor], mounts: [laser, shield, armour] }
  deployment:
    - { ship: "Warden", at: [-6, 7] }    # SW corner: out of sight, off the mine path
    - { ship: "Pawn A", at: [0, 1] }    # just past the line; one hex north to [0,0], then convert to a mine
    - { ship: "Pawn B", at: [3, 1] }    # also past the line: leave it, or if you move it tap Stay a ship

player_2:
  ships:
    - name: "Warden"
      flagship: true
      load: { missile_basic: 3, missile_advanced: 3 }
      hull:
        - { at: [0, 0],   bays: [core, sensor, magazine],     mounts: [laser, shield, point_defence] }
        - { at: [-1, 0],  bays: [coupling, engine, emitter],  mounts: [laser, shield, armour] }
        - { at: [0, -1],  bays: [coupling, magazine, engine], mounts: [launcher, shield, armour] }
    - name: "Pawn A"               # no laser and no shield: they walk in, and a smart mine wrecks the section
      hull:
        - { at: [0, 0], bays: [core, engine, stealth], mounts: [armour] }
    - name: "Pawn B"
      hull:
        - { at: [0, 0], bays: [core, engine, stealth], mounts: [armour] }
  deployment:
    - { ship: "Warden", at: [5, -5] }    # off to the side, out of sight of your Warden
    - { ship: "Pawn A", at: [0, -4] }   # one forward step (or a 2-hex opening stride) enters the smart mine's 3-hex range
    - { ship: "Pawn B", at: [1, -4] }
