# ============================================================
#  CAMPAIGN MAP  -  "The Corridor"   (Shatkon: The Weave, chapter 1)
#  A narrow asteroid corridor, 3-4 hexes wide, running the length of the board.
#  Humans deploy in the south (rows 3-7), the Seed in the north (rows -7 to -5).
#  Asteroids block movement and lasers, not sensors: you can see through the walls but not shoot.
#  Generated by campaign/tools/gen_maps.mjs - edit the shapes there and re-run.
#  Coordinates are [q, r] hex coordinates; [0, 0] is the centre; r grows to the south.
#  Zones given as lists of [q, r] are campaign zones (script triggers, spawns, AI paths);
#  the engine ignores them outside the campaign.
# ============================================================

map:
  name: "The Corridor"
  world: world_v0.4.yaml

  board:
    shape: hexagon
    radius: 7

  zones:
    player_1_home:  { edge: south, depth: 5 }
    player_2_home:  { edge: north, depth: 3 }
    no_mans_land:   { everything_else: true }
    corridor_mid: [[-2, 1], [-1, -1], [-1, 0], [-1, 1], [0, -1], [0, 0], [0, 1], [1, -1], [1, 0], [1, 1], [2, -1]]

  setup:
    secret: true
    ships: own_home_zone
    drones: own_home_zone
    mines: { own_home_zone: true, rows_into_no_mans_land: 0 }

  terrain:
    - { type: asteroid, at: [-5, 0], radius: 2 }
    - { type: asteroid, at: [3, 2], radius: 2 }
    - { type: asteroid, at: [5, -2], radius: 2 }
    - { type: asteroid, at: [-6, 4], radius: 1 }
    - { type: asteroid, at: [-2, -4], radius: 1 }
    - { type: asteroid, at: [1, 5], radius: 1 }
    - { type: asteroid, at: [6, -5], radius: 1 }
    - { type: asteroid, at: [-4, 2], size: 3 }
    - { type: asteroid, at: [-2, -2], size: 3 }
    - { type: asteroid, at: [6, 0], size: 3 }
    - { type: asteroid, at: [-1, -3], size: 1 }
    - { type: asteroid, at: [-1, -6], size: 1 }
    - { type: asteroid, at: [-2, -1], size: 1 }
    - { type: asteroid, at: [-2, 0], size: 1 }
    - { type: asteroid, at: [-3, 1], size: 1 }
    - { type: asteroid, at: [-4, -3], size: 1 }
    - { type: asteroid, at: [-4, 3], size: 1 }
    - { type: asteroid, at: [-4, 4], size: 1 }
    - { type: asteroid, at: [-5, 5], size: 1 }
    - { type: asteroid, at: [-6, 6], size: 1 }
    - { type: asteroid, at: [-7, 3], size: 1 }
    - { type: asteroid, at: [-7, 6], size: 1 }
    - { type: asteroid, at: [-7, 7], size: 1 }
    - { type: asteroid, at: [0, -4], size: 1 }
    - { type: asteroid, at: [0, -5], size: 1 }
    - { type: asteroid, at: [0, -6], size: 1 }
    - { type: asteroid, at: [0, -7], size: 1 }
    - { type: asteroid, at: [0, 4], size: 1 }
    - { type: asteroid, at: [0, 7], size: 1 }
    - { type: asteroid, at: [2, 0], size: 1 }
    - { type: asteroid, at: [4, -4], size: 1 }
    - { type: asteroid, at: [6, 1], size: 1 }
    - { type: asteroid, at: [7, -1], size: 1 }
    - { type: asteroid, at: [7, -7], size: 1 }
